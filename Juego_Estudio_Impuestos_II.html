n de oficio?", "o": ["Solo cuando hay delito penal tributario", "Siempre que haya un pago pendiente", "Solo cuando el contribuyente lo solicita", "No presentación de DDJJ, DDJJ impugnada, responsabilidad solidaria (art. 8 inc. f), cesión indebida de créditos (art. 29) y disconformidad conceptual con la liquidación"], "a": 3, "j": "Son las causas de procedencia que menciona tu resumen. Un detalle importante: si el contribuyente presentó la DDJJ y ARCA no la impugna en la vista, el proceso está mal planteado, porque 'solo procede cuando no se presentó o resulta impugnable (art. 16)'.", "id": 140}, {"t": "detof", "q": "La etapa inicial de la DO es la vista (art. 17). ¿Cuál es su contenido y plazo?", "o": ["Es una multa con 5 días para pagar", "Es la sentencia con 30 días para apelar", "Es una intimación de pago con 10 días", "Comunica las impugnaciones y cargos con fundamento detallado; el contribuyente tiene 15 días para descargo y prueba, prorrogables una sola vez por otros 15"], "a": 3, "j": "El juez administrativo debe permitir una defensa adecuada. Tras la vista el contribuyente puede no presentar descargo, conformar, o controvertir total o parcialmente. La falta de vista determina la nulidad de las actuaciones y no es subsanable posteriormente.", "id": 141}, {"t": "detof", "q": "¿Hasta cuándo conviene ofrecer prueba en una DO?", "o": ["Con el descargo, en la vista; después es tarde", "En cualquier momento hasta la sentencia", "No existe etapa probatoria", "Solo en la apelación ante el TFN"], "a": 0, "j": "Las pruebas se ofrecen y aportan junto con el descargo. Se producen dentro de 30 días de notificada la admisión (prorrogables una vez); si no, el juez puede resolver prescindiendo de ellas. El alegato no se admite, y la resolución de rechazo de prueba es inapelable.", "id": 142}, {"t": "detof", "q": "Terminada la etapa probatoria, ¿cuánto tiene ARCA para dictar la resolución determinativa y qué pasa si no lo hace?", "o": ["90 días; vencidos, el contribuyente pide pronto despacho y si pasan 30 días más sin resolver, el procedimiento caduca", "1 año; si no, prescribe la deuda", "No tiene plazo", "30 días; si no, queda firme la DDJJ"], "a": 0, "j": "Es la combinación 90 + 30 posterior a pronto despacho. La caducidad no es automática: requiere la inacción del Fisco y el pronto despacho del contribuyente.", "id": 143}, {"t": "detof", "q": "¿Qué efectos tiene la caducidad del procedimiento de DO?", "o": ["Extingue el procedimiento pero no invalida lo actuado; el Fisco puede reiniciarlo una sola vez, con autorización del Administrador Federal, informando al MECON y justificando la demora", "Anula todas las pruebas obtenidas", "Impide para siempre determinar ese período", "Extingue la deuda tributaria"], "a": 0, "j": "Caducidad extingue el derecho a continuar el procedimiento (por inacción de ARCA); no se confunde con prescripción, que extingue la acción para reclamar el tributo por el paso del tiempo.", "id": 144}, {"t": "detof", "q": "El Fisco dictó la resolución determinativa dentro del plazo, pero aún no se la notificó al contribuyente. ¿Puede este pedir la caducidad?", "o": ["Sí, pero solo luego de 1 año", "Sí, con pronto despacho", "Sí, porque no se notificó", "No: lo que importa es que se haya dictado el acto, no que esté notificado; debe pedir que se notifique fehacientemente"], "a": 3, "j": "Para que opere la caducidad lo que no debe haberse dictado es el acto administrativo. La notificación es un tema distinto (art. 100) y su omisión impide que el acto produzca efectos, pero no habilita caducidad.", "id": 145}, {"t": "detof", "q": "Notificada la resolución determinativa, el contribuyente tiene 15 días para pagar. Si no paga y no recurre:", "o": ["ARCA debe esperar 5 años", "Debe volver a correr vista", "La deuda se transforma en multa", "La resolución queda firme (cosa juzgada administrativa) y desde el día 16 ARCA puede iniciar ejecución fiscal y embargar sin nueva intimación"], "a": 3, "j": "Art. 20 y 79: la resolución intima al pago de impuesto, intereses y multa en 15 días. Si no se interponen los recursos del art. 76, queda firme y permite el juicio ejecutivo.", "id": 146}, {"t": "detof", "q": "Una DO ya firme, ¿puede modificarse luego en contra del contribuyente?", "o": ["Nunca", "Siempre, mientras no prescriba", "Solo si fue expresamente parcial (y el nuevo ajuste refiere a aspectos no considerados) o si surgen nuevos elementos o se comprueba error, omisión o dolo en los elementos considerados (art. 19)", "Solo con autorización del juez penal"], "a": 2, "j": "La DO firme tiene carácter de cosa juzgada. En cambio, si la DO fue inferior a la realidad, subsiste la obligación del contribuyente de denunciarlo y pagar la diferencia bajo pena de sanciones. Si no hay aclaración de parcialidad, no puede haber una segunda DO por lo mismo.", "id": 147}, {"t": "detof", "q": "Para pasar de la base cierta a la base presunta, ARCA debe:", "o": ["Aplicarla siempre que haya sospechas", "Elegir la que prefiera", "Pedir autorización al contribuyente", "Demostrar fehacientemente la manifiesta imposibilidad de determinar sobre base cierta (el juez administrativo no puede elegir libremente)"], "a": 3, "j": "Art. 18: la base presunta es excepcional (TFN 'Pan y Manteca SRL'). Se habilita ante oposición u obstaculización de la fiscalización, falta de libros, omisión de registraciones, compras no veraces, alteraciones de costos o incumplimiento de normas de inventarios.", "id": 148}, {"t": "detof", "q": "Entre los indicios (art. 18) que ARCA puede usar para presumir la base imponible están:", "o": ["Capital invertido, variaciones patrimoniales, resultados de períodos anteriores, compras, ventas, existencias, rendimientos de empresas similares, nivel de gastos, alquileres y consumos particulares", "Solo los dichos de un tercero denunciante", "El domicilio del contador", "El resultado de otro contribuyente aislado"], "a": 0, "j": "Son enunciativos. El indicio debe ser real (no puede provenir solo de un acta o de terceros), debe valorarse junto con el resto de hechos conocidos de la actividad y no es válida la cadena de presunciones (presunción sobre presunción).", "id": 149}, {"t": "detof", "q": "¿Qué diferencia hay entre una presunción legal absoluta y una relativa?", "o": ["La absoluta admite prueba, la relativa no", "La absoluta no admite prueba en contrario; la relativa invierte la carga de la prueba y la admite", "La relativa solo aplica a multas", "No hay diferencia"], "a": 1, "j": "Las presunciones del art. 18 son, en general, relativas: el contribuyente puede probar lo contrario con documentación fehaciente. Si se prueba la falsedad del indicio, cae la presunción. Las simples se basan en el criterio del juzgador.", "id": 150}, {"t": "detof", "q": "En operaciones internacionales (art. 18.2), un ingreso de fondos desde países de baja o nula tributación o no cooperantes se considera:", "o": ["Una donación exenta", "Incremento patrimonial no justificado, salvo que se pruebe el origen en actividades del contribuyente o de terceros en el país, o que provienen de fondos declarados", "Un crédito fiscal", "Una exportación gravada"], "a": 1, "j": "Es una presunción relativa que invierte la carga: el contribuyente debe acreditar el origen. El art. 18.3 trata precios de transferencia y presume correcta la determinación del Fisco si el contribuyente no presentó DDJJ ni comprobantes, con derecho a probar lo contrario.", "id": 151}, {"t": "detof", "q": "El acuerdo conclusivo voluntario (art. 16.1, Ley 27.430) puede solicitarse:", "o": ["Antes del dictado de la resolución determinativa, por el Fisco o por el contribuyente; suspende la prescripción por 1 año y no procede si el caso encuadra en la ley penal tributaria", "Solo por el contribuyente luego de apelar", "En cualquier etapa, incluso penal", "Después de la sentencia del TFN"], "a": 0, "j": "Es una conciliación para casos que requieran apreciación de hechos, valoraciones complejas o novedad. Lo aprueba el Administrador Federal. Si el contribuyente lo acepta, opera como título ejecutivo; si no, sigue la DO. El apunte aclara que no está reglamentado.", "id": 152}, {"t": "detof", "q": "La resolución determinativa puede cerrar con cuatro resultados posibles. ¿Cuál NO es uno de ellos?", "o": ["Sin interés fiscal", "Con interés fiscal", "Conformada totalmente por el contribuyente", "Con prescripción de pleno derecho"], "a": 3, "j": "Los resultados son: sin interés fiscal, con interés fiscal, conformada totalmente y conformada parcialmente. La resolución debe cumplir los elementos del art. 7 LPA: competencia, causa, objeto, procedimiento, motivación, finalidad y forma, y ser firmada por el juez administrativo con dictamen jurídico previo.", "id": 153}, {"t": "detof", "q": "Si en la misma verificación se determina un impuesto y se detecta una infracción vinculada, ¿cuándo debe aplicarse la multa (art. 74 DR / art. 17 LPT)?", "o": ["Nunca puede aplicarse", "En una resolución posterior, cuando quiera", "Solo en sede penal", "En la misma resolución de DO; si no se incluye, se entiende que no hay mérito para sancionar ese hecho"], "a": 3, "j": "Evita dobles actuaciones por el mismo hecho y garantiza defensa conjunta de deuda y sanción. Es una garantía del contribuyente.", "id": 154}, {"t": "rec", "q": "Contra una resolución de determinación de oficio, ¿qué recursos puede interponer el contribuyente (art. 76) y en qué plazo?", "o": ["Solo apelación judicial en 5 días", "Ambos a la vez, en 30 días", "Reconsideración ante ARCA o apelación ante el Tribunal Fiscal de la Nación, a elección y excluyentes, dentro de 15 días hábiles", "Recurso jerárquico en 30 días"], "a": 2, "j": "Art. 76: para determinaciones de tributos y accesorios (cierta o presuntiva), sanciones y repeticiones. Si elige reconsideración, luego puede ir a la justicia (1ª instancia, Cámara, Corte). Si elige TFN, se saltea la primera instancia y pasa directo a la Cámara.", "id": 155}, {"t": "rec", "q": "¿Qué diferencia práctica hay entre ir por reconsideración o por apelación al TFN?", "o": ["La reconsideración es más rápida y más barata siempre", "Ninguna", "El TFN es un tribunal judicial", "El TFN es un tribunal administrativo dentro del Poder Ejecutivo pero fuera de ARCA (más imparcial); la reconsideración la resuelve la propia ARCA y suele confirmar lo decidido"], "a": 3, "j": "El TFN actúa como un tribunal, aunque no es Poder Judicial. Se elige reconsideración sobre todo en montos bajos que no habilitan al TFN (hay topes por monto/materia). Quien apela al TFN debe, dentro de los 15 días, avisar a ARCA que va a apelar, o puede ser embargado.", "id": 156}, {"t": "rec", "q": "¿Cuál de estas materias NO puede llevarse al Tribunal Fiscal de la Nación?", "o": ["Determinación de oficio de impuestos", "Exclusión del monotributo", "Repetición de tributos", "Aplicación de multas"], "a": 1, "j": "Tampoco: liquidaciones de anticipos o pagos a cuenta, de solo intereses o actualizaciones, caducidad de planes de pago, devolución de reintegros de IVA por exportaciones, e intimaciones del art. 14.", "id": 157}, {"t": "rec", "q": "Se aplica una clausura al establecimiento. El recurso especial del art. 77 se interpone:", "o": ["No es recurrible", "En 15 días ante el TFN", "Dentro de 5 días ante un funcionario superior de ARCA (que resuelve en 10 días) y luego puede apelarse al juez penal económico o federal; tiene efecto suspensivo", "En 30 días ante la Corte"], "a": 2, "j": "El art. 77 aplica a clausura, suspensión de matrícula, licencia o inscripción en registros. La suspensión del efecto evita ejecutar la sanción mientras se tramita.", "id": 158}, {"t": "rec", "q": "Si ARCA decomisa mercadería (art. 40.1), ¿qué plazo y efecto tiene el recurso del art. 78?", "o": ["5 días y no suspende nada", "30 días ante el TFN", "3 días para apelar ante un superior (resuelve en 10 días, 48 horas si es urgente); suspende el decomiso pero no el secuestro", "15 días y suspende todo"], "a": 2, "j": "Secuestro: retención provisional (en depósito que alquila ARCA a costa del contribuyente). Decomiso: pérdida definitiva. La interdicción impide usar o vender la mercadería hasta regularizar la documentación.", "id": 159}, {"t": "rec", "q": "El recurso de amparo de la demora (art. 182) permite ir al TFN cuando:", "o": ["El contribuyente quiere más plazo", "ARCA rechazó una devolución", "ARCA demora injustificadamente un trámite que afecta un derecho, y pasaron 15 días desde el pronto despacho sin respuesta", "Hay una multa pendiente"], "a": 2, "j": "Es una excepción: el TFN normalmente solo interviene frente a actos definitivos. Aquí actúa por inacción. El TFN pide informe a ARCA y, si no justifica, le ordena resolver o libera al contribuyente del trámite (con garantía).", "id": 160}, {"t": "rec", "q": "Un contribuyente pagó espontáneamente de más y pide la repetición (art. 81). ARCA no responde. ¿Qué puede hacer?", "o": ["Pasados 3 meses, considerar denegado el reclamo y optar por reconsideración, apelación ante el TFN o demanda ante la Justicia Nacional", "Ir directo a ejecución fiscal", "Esperar 5 años", "Pedir condonación"], "a": 0, "j": "Si el pago fue consecuencia de una DO, va directo a demanda ante el TFN o la justicia, sin reclamo previo. Ojo: el reclamo de repetición autoriza a ARCA a revisar todo el período (aun prescripto) y a compensar deudas, y en impuestos indirectos (IVA) hay que probar que no se trasladó el impuesto o que se devolvió al cliente.", "id": 161}, {"t": "rec", "q": "En el juicio de ejecución fiscal (art. 92), ¿qué título basta para iniciarlo y qué excepciones puede oponer el ejecutado?", "o": ["Un acta; excepciones del art. 605 CPCCN", "Una carta documento; ninguna defensa", "Boleta de deuda; solo pago documentado, espera documentada, prescripción e inhabilidad de título, en 5 días", "Sentencia penal; cualquier defensa"], "a": 2, "j": "La boleta de deuda es título ejecutivo. No se admiten otras defensas ni las del art. 605 CPCCN. Si no se oponen excepciones se dicta sentencia sin más trámite; esta es inapelable, aunque el ejecutado puede luego repetir lo pagado (art. 81). Se estima un 15% por intereses y costas.", "id": 162}, {"t": "rec", "q": "Diferencia entre recursos de la ley 11.683 y de la LPA: el recurso de reconsideración del decreto reglamentario de la LPA se interpone en 20 días; el del art. 76 de la ley 11.683 en:", "o": ["30 días", "15 días", "90 días", "5 días"], "a": 1, "j": "Por especialidad se aplica el plazo de la ley de procedimiento tributario (15 días hábiles). El recurso jerárquico de la LPA es de 30 días y no requiere reconsideración previa; el de alzada procede contra actos del órgano superior de un ente autárquico.", "id": 163}, {"t": "rec", "q": "El recurso del art. 74 del DR (genérico) se usa cuando:", "o": ["Solo en el procedimiento penal", "Para apelar sentencias del TFN", "Siempre que se discuta una multa", "La ley de procedimiento fiscal no prevé un recurso especial para ese caso (ej.: denegatoria de prórroga en una DO)"], "a": 3, "j": "Es residual: actúa cuando hay un vacío. El art. 76, en cambio, es el recurso formal para las resoluciones que determinan tributos, aplican sanciones o deciden repeticiones.", "id": 164}, {"t": "rec", "q": "Contra una sentencia del Tribunal Fiscal, ¿qué recurso procede?", "o": ["Ninguno", "Reconsideración ante ARCA", "Apelación directa ante la Corte Suprema", "Apelación ante la Cámara en lo Contencioso Administrativo Federal"], "a": 3, "j": "Luego de la Cámara, queda el recurso extraordinario federal ante la Corte, si hay cuestión federal o arbitrariedad. El recurso aclaratorio (art. 191) sirve para pedir al TFN que corrija o aclare puntos de su sentencia.", "id": 165}, {"t": "sanc", "q": "¿Cuándo comienzan a devengarse los intereses resarcitorios (art. 37)?", "o": ["Desde la sentencia", "Desde la resolución de DO", "Desde el día siguiente al vencimiento de la obligación, sin necesidad de intimación; compensan la mora", "Desde la intimación de pago"], "a": 2, "j": "Son indemnizatorios y automáticos. La tasa la fija el Ministerio de Economía. Si se paga la DDJJ pero no los intereses, esos intereses siguen devengándose. Se frena con el pago, el pedido de prórroga fundado, la demanda de ejecución fiscal o la apertura de concurso.", "id": 166}, {"t": "sanc", "q": "Un saldo de Bienes Personales vence el 16/04/2013, no se paga, y ARCA interpone demanda de ejecución el 12/08/2013. ¿Qué intereses corren hasta ese día y desde entonces?", "o": ["Resarcitorios siempre", "Ninguno hasta la sentencia", "Punitorios siempre", "Resarcitorios hasta el 12/08/2013; punitorios desde la demanda"], "a": 3, "j": "Los punitorios (art. 52) son el interés por no pagar tras la demanda de ejecución (sobre impuestos, multas e intereses). No conviven con los resarcitorios: uno empieza cuando termina el otro. Ejercicio de la cátedra.", "id": 167}, {"t": "sanc", "q": "Los intereses del art. 168 los aplica:", "o": ["El juez penal", "El Tribunal Fiscal, cuando considera que la apelación se interpuso solo para hacer perder el tiempo", "El banco", "ARCA en cada DO"], "a": 1, "j": "Es una sanción adicional por conducta dilatoria o temeraria en el recurso ante el TFN.", "id": 168}, {"t": "sanc", "q": "Una sociedad deja de ingresar el impuesto por presentar una DDJJ inexacta, por error razonable en la interpretación de una norma compleja. ¿Qué corresponde?", "o": ["Multa de 2 a 6 veces del art. 46", "Multa del 100% del art. 45", "No hay multa por error excusable, aunque sí deben ingresarse impuesto e intereses", "Clausura"], "a": 2, "j": "El error excusable elimina la culpabilidad: no es dolo ni culpa sancionable. Debe ser razonable y fundado (ej.: interpretación discutible pero sustentada). El art. 45 exige que no haya error excusable.", "id": 169}, {"t": "sanc", "q": "¿Cuál es la diferencia entre el art. 45 y el art. 46?", "o": ["Art. 45 es penal y art. 46 administrativo", "Art. 45 sanciona omisión sin dolo (multa del 100% del tributo omitido, agravada en ciertos casos); art. 46 sanciona defraudación con dolo (multa de 2 a 6 veces el tributo evadido)", "Son lo mismo con distinta multa", "Art. 45 requiere dolo y art. 46 no"], "a": 1, "j": "Ambos son infracciones administrativas, no delitos. El dolo tiene elemento intelectual (conocer el acto y sus consecuencias) y volitivo (quererlo). El art. 47 enumera indicios (presunciones relativas) de declaraciones engañosas, como grave contradicción entre libros y DDJJ, estructuras artificiosas o no usar instrumentos de control obligatorio.", "id": 170}, {"t": "sanc", "q": "Una empresa actúa como agente de retención de Ganancias, retiene el impuesto a sus proveedores y, intimada por ARCA, no lo ingresa. ¿Qué infracción corresponde?", "o": ["Omisión del art. 45", "Defraudación del art. 46 por ardid", "Multa formal del art. 38", "Retención indebida/falta de ingreso de lo retenido (art. 48)"], "a": 3, "j": "Si en cambio ni siquiera practicó la retención, es omisión (art. 45). Si ingresa lo retenido pero no presenta la DDJJ, la infracción es formal (art. 38). Si además se superan los umbrales penales y el plazo, puede configurar el delito de apropiación indebida.", "id": 171}, {"t": "sanc", "q": "Según el art. 49, ¿cuál es el beneficio si el contribuyente regulariza su situación antes de la orden de intervención y no es reincidente?", "o": ["Exención total de la multa por infracciones materiales", "50% del mínimo legal", "25% del mínimo legal", "Mínimo legal completo"], "a": 0, "j": "Tabla del art. 49: antes de orden de intervención → exento (100%); entre orden y vista (art. 36) → paga 25% del mínimo; antes de la vista del art. 17 → 50%; después de la vista y antes del primer vencimiento → 75%; si acepta la DO → mínimo legal completo. Siempre sin reincidencia.", "id": 172}, {"t": "sanc", "q": "Un contribuyente presenta rectificativa y paga el impuesto omitido después de recibir la vista del art. 17 (art. 49), sin ser reincidente. ¿Cuánto del mínimo legal de la multa paga?", "o": ["50%", "75% del mínimo legal", "0%", "25%"], "a": 1, "j": "La reducción disminuye a medida que avanza el procedimiento: cuanto antes regulariza, menos paga. Después de la vista y antes del primer vencimiento corresponde el 75% del mínimo.", "id": 173}, {"t": "sanc", "q": "La diferencia entre 'reiteración' y 'reincidencia' (art. 50) es que:", "o": ["Reincidencia solo aplica a multas formales", "Son sinónimos", "Reiteración requiere sentencia penal", "Reiteración: dos o más infracciones similares sin condena firme entre ellas; reincidencia: nueva infracción después de condena firme por una similar (no hay reincidencia si pasaron más de 5 años)"], "a": 3, "j": "La reincidencia agrava y además impide acceder a las reducciones del art. 49. Es un concepto que mide la conducta previa del contribuyente.", "id": 174}, {"t": "sanc", "q": "Entre los agravantes de la graduación de sanciones (art. 50.3) se cuentan:", "o": ["Buena conducta previa", "Actitud negativa ante la inspección, malos registros contables, mala conducta previa, peligrosidad fiscal, ocultamiento o falsedad de inventario y mal uso de beneficios fiscales", "Renuncia al término de prescripción", "Buena organización contable"], "a": 1, "j": "Los atenuantes son: actitud positiva frente a la fiscalización, buena organización contable, buena conducta previa y renuncia al término de prescripción. Son pautas de graduación para el juez administrativo.", "id": 175}, {"t": "sanc", "q": "Sobre la clausura del art. 40: ¿cuál es la sanción y ante qué conductas procede?", "o": ["Solo multa, nunca clausura", "Clausura permanente por deuda", "Clausura de 2 a 6 días del establecimiento, ante no emitir comprobantes, no registrar operaciones, transportar mercadería sin respaldo, no estar inscripto, no conservar facturas, no usar instrumentos de control o tener personal sin registrar (en establecimientos de al menos 10 empleados, 50% o más)", "Clausura de 30 días por cualquier atraso"], "a": 2, "j": "Con uno solo de los supuestos ya procede. Se aplica con acta de constatación (art. 41) y la clausura implica cese total de la actividad, salvo la necesaria para conservar bienes o procesos de producción que no pueden interrumpirse (art. 43). Se recurre por el art. 77.", "id": 176}, {"t": "sanc", "q": "La clausura preventiva (art. 75) se diferencia de la del art. 40 porque:", "o": ["Solo la puede ordenar el TFN", "Dura 30 días", "No se computa luego", "La dispone el funcionario de ARCA (no el juez administrativo) ante dos o más hechos del art. 40 o reincidencia, debe avisar al juez, y no puede exceder 3 días sin intervención judicial; los días cumplidos se descuentan de la clausura definitiva"], "a": 3, "j": "Es una medida cautelar por peligro fiscal. Se levanta si el responsable regulariza.", "id": 177}, {"t": "sanc", "q": "Para el sumario por infracciones formales (arts. 70 y 71), ¿qué plazo tiene el infractor para el descargo?", "o": ["30 días corridos sin prórroga", "24 horas", "60 días", "15 días prorrogables por 15 más (5 días si es infracción del art. 39, por ej. no emitir factura)"], "a": 3, "j": "El sumario es una investigación interna que detalla la falta imputada. Luego del descargo se sigue el trámite de los arts. 17 y ss. Es confidencial para terceros (art. 73).", "id": 178}, {"t": "sanc", "q": "Sobre la naturaleza de las sanciones tributarias existen tres doctrinas. La que hoy sigue la Corte es:", "o": ["La administrativista pura", "Ninguna", "La penalista pura", "La de la unicidad (equilibrio entre administrativista y penalista): puede sancionar ARCA o el juez, pero no ambos por el mismo hecho"], "a": 3, "j": "Administrativista: ilícito administrativo, sanciona ARCA. Penalista: las multas son penas y deben ser juzgadas judicialmente. Unicidad: el non bis in idem (art. 18 CN) impide la doble sanción por el mismo sustento fáctico y objetivo (Haddad, Bidart Campos).", "id": 179}, {"t": "sanc", "q": "El principio non bis in idem impide en todos los casos aplicar multa administrativa y pena penal por hechos vinculados.", "o": ["Verdadero", "Falso"], "a": 1, "j": "Falso. Impide la doble sanción cuando comparten sustento fáctico y objetivo y cumplen la misma función; se admite cuando son hechos diferentes o tienen funciones distintas (prevención administrativa vs castigo penal).", "vf": true, "id": 180}, {"t": "presc", "q": "¿Qué extingue la prescripción liberatoria?", "o": ["La acción para exigir el crédito, no el derecho: el crédito subsiste como obligación natural", "El hecho imponible", "La deuda y los intereses ya pagados", "El derecho y la acción"], "a": 0, "j": "Por eso el pago espontáneo de una obligación prescripta no es repetible (art. 2538 CCyC). No debe confundirse con la caducidad, que extingue el derecho a continuar un procedimiento por inacción de ARCA.", "id": 181}, {"t": "presc", "q": "Plazos del art. 56: ¿cuál es la regla?", "o": ["2 años para monotributistas", "5 años para no inscriptos y 10 para inscriptos", "10 años para todos", "5 años para inscriptos y para no inscriptos sin obligación de inscribirse (o que regularicen espontáneamente); 10 años para contribuyentes no inscriptos"], "a": 3, "j": "La lógica: quien debiendo inscribirse no lo hizo oculta su existencia ante el Fisco, por lo que el plazo es más largo. Para agentes de retención y percepción son 5 años desde el 1° de enero siguiente al año en que debieron cumplir.", "id": 182}, {"t": "presc", "q": "¿Desde cuándo se cuenta el plazo para determinar y exigir el pago de impuestos (art. 57)?", "o": ["Desde el día del vencimiento", "Desde la vista", "Desde la fiscalización", "Desde el 1° de enero siguiente al año en que vencen los plazos generales para presentar la DDJJ e ingresar el gravamen"], "a": 3, "j": "Un impuesto con vencimiento en 2018 empieza a correr el 1/1/2019 y, con 5 años, prescribe el 31/12/2023 si no hay suspensión ni interrupción.", "id": 183}, {"t": "presc", "q": "¿Desde cuándo se cuenta la prescripción para APLICAR una multa y desde cuándo para HACERLA EFECTIVA?", "o": ["Ambas desde la firmeza", "Aplicar: 1° de enero siguiente a la comisión de la infracción; hacerla efectiva: desde el día siguiente a que quede firme la resolución que la impuso", "Ambas desde la infracción", "Aplicar desde la firmeza; hacerla efectiva desde la infracción"], "a": 1, "j": "Son dos acciones distintas. Primero el Fisco tiene que aplicar la sanción dentro del plazo; una vez firme, corre otro plazo para cobrarla.", "id": 184}, {"t": "presc", "q": "¿Desde cuándo prescribe la acción de repetición de un pago ya efectuado?", "o": ["Desde la presentación del reclamo", "Desde la DO", "Desde el 1° de enero siguiente al año de la fecha de cada pago, en forma independiente (si es de período vencido)", "Desde la intimación"], "a": 2, "j": "Hay reglas separadas para períodos vencidos, vencidos y a vencer, y a vencer. También para créditos indebidamente acreditados, devueltos o transferidos (desde el 1/1 siguiente a esa fecha) y para recupero o devolución de impuestos (desde el 1/1 siguiente a la procedencia).", "id": 185}, {"t": "presc", "q": "La diferencia entre suspensión e interrupción de la prescripción es:", "o": ["La suspensión detiene el cómputo y, al cesar la causal, se suma el tiempo anterior; la interrupción borra todo el tiempo transcurrido y se empieza a contar de nuevo", "La interrupción solo afecta multas", "Son iguales", "La suspensión borra el tiempo"], "a": 0, "j": "Ejemplos: la intimación administrativa de pago de los tributos determinados por ARCA (art. 65 inc. a, según tu apunte) suspende; el acuerdo conclusivo suspende 1 año. La renuncia al término y el reconocimiento de la obligación tienen efecto interruptivo. Revisá en la ley el listado exacto de causales (arts. 65 a 67).", "id": 186}, {"t": "presc", "q": "La fiscalización iniciada, sin que exista intimación de pago ni DO, ¿suspende la prescripción?", "o": ["Sí, por 1 año", "No: sin intimación administrativa de pago de tributos determinados no hay causal suspensiva", "Sí, siempre", "Sí, hasta la sentencia"], "a": 1, "j": "Caso práctico de la cátedra: vista corrida el 25/02/2019 por Ganancias 2017; sin intimación, la prescripción corre normalmente 5 años, y empieza el 1/1/2019 si la DDJJ se presentó en 2018.", "id": 187}, {"t": "presc", "q": "El contribuyente, antes de que prescriba, renuncia al término de prescripción a cambio de dilatar la fiscalización. ¿Cómo se valora esa conducta en las sanciones?", "o": ["Es un atenuante para graduar la multa (art. 50.3)", "Es un agravante", "No tiene efecto", "Extingue la sanción"], "a": 0, "j": "Es una forma de colaboración: acepta extender el plazo para que ARCA pueda fiscalizar.", "id": 188}, {"t": "presc", "q": "La prescripción de los delitos tributarios se rige por la Ley 11.683.", "o": ["Verdadero", "Falso"], "a": 1, "j": "Falso. Los delitos se rigen por el Código Penal. La Ley 11.683 regula la prescripción de las acciones administrativas del Fisco (impuestos y multas).", "vf": true, "id": 189}, {"t": "penal", "q": "¿Cuál es la diferencia de fondo entre infracción tributaria y delito tributario?", "o": ["No hay diferencia, solo el nombre", "Los delitos solo exigen culpa", "Las infracciones las juzga siempre el juez penal", "Infracción: juzga el Poder Ejecutivo (ARCA), sanción generalmente multa, culpa o dolo con presunciones (art. 47). Delito: juzga el Poder Judicial, pena generalmente de prisión, requiere dolo sin presunciones"], "a": 3, "j": "El PE no puede ejercer funciones judiciales por la Constitución, y aplica multas como excepción originaria. Respecto de personas jurídicas: en infracciones se aplica a ellas la misma sanción (multa, clausura); en delitos, sanciones distintas a las de las personas humanas (ej.: pérdida de personería). El bien jurídico protegido en delitos es la Hacienda Pública.", "id": 190}, {"t": "penal", "q": "El dolo en el delito tributario tiene:", "o": ["Solo el elemento intelectual", "Es lo mismo que la culpa", "Solo el volitivo", "Doble contenido: elemento intelectual (conocer el acto y sus consecuencias) y elemento volitivo (quererlo y hacerlo)"], "a": 3, "j": "Por eso en el delito no hay 'presunciones normativas' de dolo: debe probarse la intención de engañar y la lesión al bien jurídico.", "id": 191}, {"t": "penal", "q": "Si hay duda sobre la intención de evadir, el principio aplicable en sede penal es:", "o": ["In dubio pro reo (a favor del contribuyente) e inocencia: la carga de probar el dolo es del acusador", "Que se aplica por analogía el art. 47", "Que el contribuyente debe probar su inocencia", "Que la duda favorece al Fisco"], "a": 0, "j": "Principios penales aplicables: legalidad, lesividad, tipicidad (sin analogía), irretroactividad y retroactividad de la ley más benigna, inocencia, in dubio pro reo, proporcionalidad, non bis in idem, debido proceso y personalidad de la pena.", "id": 192}, {"t": "penal", "q": "Según la clase actual (Ley 27.430 mod. por Ley 27.799), la evasión simple se configura cuando el monto evadido supera:", "o": ["$15.000.000", "$1.000.000.000", "$100.000.000 por tributo y por ejercicio anual (pena de 2 a 6 años)", "$1.500.000"], "a": 2, "j": "Atención: tus ejercicios viejos usan los montos originales de la Ley 27.430 ($1.500.000 para evasión simple, $15.000.000 como agravante por monto). La clase más nueva usa $100.000.000 y $1.000.000.000. Para el final conviene usar los vigentes (27.799) y aclarar cuál aplicás.", "id": 193}, {"t": "penal", "q": "La evasión agravada del art. 2 (pena de 3 años y 6 meses a 9 años) se configura, además del monto, por:", "o": ["Haber presentado DDJJ en término", "La reincidencia en multas formales", "El simple atraso en el pago", "Uso de personas o entidades interpuestas, estructuras o jurisdicciones no cooperantes, uso fraudulento de beneficios fiscales o facturas apócrifas"], "a": 3, "j": "Cada supuesto tiene su propio monto en la ley original (ej.: $2.000.000 para interposición de personas o beneficios, $1.500.000 para facturas apócrifas). En la clase se destacan además estructuras fiduciarias y actuación organizada.", "id": 194}, {"t": "penal", "q": "Una empresa tiene un ajuste de Ganancias de $1.650.000 por facturas apócrifas e IVA de $2.120.000, ambos del ejercicio 2021. Con los montos ORIGINALES de la Ley 27.430, ¿corresponde denuncia?", "o": ["No, porque los montos no se suman", "Solo si se suman con intereses", "Solo por IVA", "Sí: cada tributo supera el umbral por tributo y por ejercicio (y hay facturas apócrifas, supuesto de agravada)"], "a": 3, "j": "Los montos se analizan por tributo y por ejercicio, sin sumar tributos distintos y sin incluir intereses (el apunte aclara que 'no pueden sumarse los intereses'). Con los umbrales de la Ley 27.799 ($100.000.000) el caso no superaría el mínimo: es una buena razón para aclarar en el examen qué norma aplicás.", "id": 195}, {"t": "penal", "q": "Ajuste de Ganancias $1.000.000 y de IVA $500.000 (más $25.000 de intereses, total $1.525.000). Con los montos ORIGINALES de la ley, ¿se supera el umbral para evasión simple?", "o": ["No: ninguno de los tributos supera $1.500.000; el umbral se mide por tributo, sin sumar y sin intereses", "Sí, por Ganancias", "Sí, porque el total es $1.525.000", "Sí, porque hay facturas apócrifas"], "a": 0, "j": "Es una de las trampas típicas del examen: sumar tributos o incluir intereses para pasar el umbral. Corresponde la vía administrativa (ley 11.683) pero no la denuncia penal.", "id": 196}, {"t": "penal", "q": "La apropiación indebida de tributos (art. 4) la comete:", "o": ["El agente de retención o percepción que no deposita, total o parcialmente, dentro de los 30 días corridos de vencido el plazo de ingreso, siempre que supere el monto por cada mes", "El contador de la empresa", "Cualquier contribuyente que no paga su impuesto propio", "El que presenta DDJJ en blanco"], "a": 0, "j": "Es un delito de omisión: no requiere ardid. El monto original era $100.000 por mes (arts. 4 y 7, ver tu texto del Régimen Penal Tributario); verificá el monto actualizado en la clase. Solo aplica a tributos retenidos o percibidos, no al impuesto propio.", "id": 197}, {"t": "penal", "q": "El caso 'Soy Vivo SA': retuvo Ganancias de empleados por $1.436.000 y no lo ingresó. ARCA notifica el 15/5/2023 que denunciará el 15/6/2023. Si la empresa paga ANTES de la denuncia, ¿qué sucede (art. 16 LPT)?", "o": ["Nada: la denuncia sigue igual", "Se pierde el derecho a defensa", "Se duplica la pena", "Se extingue la acción penal, siempre que sea la primera vez que accede a ese beneficio"], "a": 3, "j": "La regularización espontánea antes de la denuncia extingue la acción penal por única vez. Si paga luego de la denuncia, ya no extingue; y si ya había accedido al beneficio el año anterior por el mismo hecho y monto similar, no puede volver a usarlo.", "id": 198}, {"t": "penal", "q": "Una empresa fue denunciada penalmente luego de una DO por defraudación en Ganancias. En sede penal quiere discutir si hubo defraudación. ¿Puede?", "o": ["Solo con autorización de ARCA", "No, la DO es cosa juzgada para el juez penal", "Sí: en sede penal rige la inocencia y ARCA (querellante) debe demostrar el dolo; la DO no obliga al juez penal", "Solo si apela al TFN primero"], "a": 2, "j": "El proceso penal es independiente. Esto se vincula con la doctrina de la unicidad: no se sanciona dos veces el mismo hecho, pero el juez penal valora el delito con sus propias pruebas.", "id": 199}, {"t": "penal", "q": "¿Qué órgano tiene competencia en caso de denuncia penal tributaria en el interior del país y en CABA?", "o": ["El superior de ARCA", "El juez civil", "Tribunal Fiscal de la Nación", "Juzgado federal en el interior; en CABA, juzgado penal tributario (o contencioso administrativo federal si no hubiese penal tributario)"], "a": 3, "j": "ARCA denuncia luego de la resolución de DO (con dictamen), y se sigue instrucción, juicio oral y sentencia. El principio de personalidad de la pena impide trasladar la condena a un tercero (por ej., a la sociedad o a un heredero).", "id": 200}, {"t": "penal", "q": "Delitos de la seguridad social: la apropiación indebida de recursos de la seguridad social (art. 7) la comete:", "o": ["El jubilado", "El empleado", "El empleador que no paga contribuciones patronales no retenidas", "El empleador que no deposita dentro de los 30 días corridos los aportes retenidos a sus dependientes, superado el monto mensual"], "a": 3, "j": "Se trata de lo retenido al trabajador (aportes). La evasión simple (art. 5) y agravada (art. 6) de aportes y contribuciones usan montos por cada mes; en el texto original: $200.000 (simple) y $1.000.000 (agravada).", "id": 201}, {"t": "pf", "q": "ARCA puede citar al firmante de la DDJJ, al presunto contribuyente o responsable, o a cualquier tercero.", "o": ["Verdadero", "Falso"], "a": 0, "j": "Verdadero. Son facultades amplias de verificación y fiscalización (citaciones, verificaciones por cuestionario escrito e inspecciones). Si hay resistencia puede pedir orden de allanamiento al juez federal o disponer clausura preventiva.", "vf": true, "id": 202}, {"t": "pf", "q": "En la Ley de Procedimiento, las acciones y poderes del Fisco para determinar y exigir el pago de impuestos de contribuyentes inscriptos prescriben a los 5 años.", "o": ["Verdadero", "Falso"], "a": 0, "j": "Verdadero (art. 56). Contribuyentes no inscriptos: 10 años. Agentes de retención y percepción: 5 años desde el 1° de enero siguiente al año en que debieron cumplir.", "vf": true, "id": 203}, {"t": "pf", "q": "La prescripción para repetir un impuesto comienza a correr desde el vencimiento del plazo para presentar la DDJJ.", "o": ["Verdadero", "Falso"], "a": 1, "j": "Falso. Para repetir, corre desde el 1° de enero siguiente al año de la fecha de cada pago (período vencido). Desde el vencimiento de la DDJJ corre la acción del Fisco para determinar y exigir el pago.", "vf": true, "id": 204}, {"t": "pf", "q": "Los plazos de notificación de la ley de procedimiento se cuentan en días corridos.", "o": ["Verdadero", "Falso"], "a": 1, "j": "Falso: por regla los plazos de la ley se cuentan en días hábiles administrativos. Si la notificación se produce en día inhábil se tiene por practicada el hábil siguiente; durante la feria fiscal el cómputo comienza luego de ella.", "vf": true, "id": 205}, {"t": "pf", "q": "Los plazos de vencimiento de los pagos de obligaciones tributarias están determinados en la ley 11.683.", "o": ["Verdadero", "Falso"], "a": 1, "j": "Falso. Los fija ARCA por resolución general; la ley 11.683 regula el procedimiento.", "vf": true, "id": 206}, {"t": "pf", "q": "Siempre que me equivoco en una DDJJ puedo presentar una rectificativa.", "o": ["Verdadero", "Falso"], "a": 1, "j": "Falso, según tu examen 2024: la rectificativa tiene límites (por ejemplo, no sirve para evitar los efectos de una fiscalización o determinación ya iniciada y, si implica pagar menos, hay restricciones).", "vf": true, "id": 207}, {"t": "pf", "q": "La suspensión de la prescripción para el deudor principal no produce efecto respecto del deudor solidario.", "o": ["Verdadero", "Falso"], "a": 1, "j": "Falso. La suspensión o interrupción respecto del deudor principal alcanza al solidario. Además la suspensión y la interrupción NO producen los mismos efectos: la primera suma el tiempo anterior al posterior; la segunda lo borra y se cuenta de nuevo desde el 1° de enero siguiente.", "vf": true, "id": 208}, {"t": "pf", "q": "Si una DO incrementa el impuesto a pagar durante una prescripción en curso, las prescripciones del impuesto original y del incremento se computan por separado.", "o": ["Verdadero", "Falso"], "a": 0, "j": "Verdadero (según tu examen de 2024): cada concepto tiene su propio cómputo.", "vf": true, "id": 209}, {"t": "pf", "q": "En la Ley de Procedimiento se puede renunciar a la prescripción ganada, lo cual es amparado por el CCyC.", "o": ["Verdadero", "Falso"], "a": 0, "j": "Verdadero (según tu examen 2024). Recordá que el pago espontáneo de una obligación prescripta no es repetible (art. 2538 CCyC).", "vf": true, "id": 210}, {"t": "pf", "q": "El Código Procesal Civil y Comercial de la Nación es la primera norma supletoria ante un vacío de la ley de procedimiento.", "o": ["Verdadero", "Falso"], "a": 1, "j": "Falso, según tu examen 2024: primero se acude a la ley de procedimiento administrativo y su decreto reglamentario; el CPCCN es supletorio de ellos.", "vf": true, "id": 211}, {"t": "pf", "q": "Una citación a declarar verbalmente que se cumple fuera de término tiene 'plazo de gracia' de dos horas del día siguiente.", "o": ["Verdadero", "Falso"], "a": 1, "j": "Falso según tu examen 2024. El plazo de gracia de dos horas corresponde a las presentaciones escritas, no a la comparecencia a una citación.", "vf": true, "id": 212}, {"t": "pf", "q": "ARCA fue creada por la Ley 11.683.", "o": ["Verdadero", "Falso"], "a": 1, "j": "Falso. La Ley 11.683 es la ley de procedimiento tributario; el organismo se creó por decreto.", "vf": true, "id": 213}, {"t": "pf", "q": "Los consumidores finales están obligados a exigir la entrega de la factura.", "o": ["Verdadero", "Falso"], "a": 0, "j": "Verdadero (según tu examen). También: la omisión de presentar DDJJ informativas origina multa automática (art. 38) y quienes transportan mercaderías sin respaldo documental son sancionados con clausura.", "vf": true, "id": 214}, {"t": "pf", "q": "Para el Fisco, el pago de anticipos puede exigirse hasta el vencimiento del plazo general para presentar la DDJJ.", "o": ["Verdadero", "Falso"], "a": 0, "j": "Verdadero según tu examen.", "vf": true, "id": 215}, {"t": "pf", "q": "La presentación de una consulta ante ARCA suspende los plazos de prescripción.", "o": ["Verdadero", "Falso"], "a": 1, "j": "Falso. La consulta no suspende prescripción ni justifica el incumplimiento del pago. Si es consulta vinculante, la respuesta obliga a ARCA respecto del consultante.", "vf": true, "id": 216}, {"t": "pf", "q": "Etapas del proceso de verificación y fiscalización:", "o": ["Apelación al TFN", "Inicio (orden de intervención, F.8000), desarrollo (citaciones, verificaciones por cuestionario, inspecciones) y cierre (F.8900 con resultado)", "Solo la DO", "Vista, prueba y resolución"], "a": 1, "j": "Cierre: sin interés fiscal; ajustes conformados totalmente (rectificativas); conformados parcialmente; no conformados → se inicia la determinación de oficio con vista. La DDJJ, respaldada por comprobantes, goza de presunción de veracidad: ARCA ejerce control posterior.", "id": 217}, {"t": "pf", "q": "La orden de intervención debe contener:", "o": ["La sentencia del TFN", "El monto de la multa", "Fecha, identificación del contribuyente, impuestos y períodos a fiscalizar y funcionarios responsables", "Solo el nombre del inspector"], "a": 2, "j": "Se notifica con el F.8000 (inspector, supervisor, área, impuestos y períodos). Es la que habilita formalmente la fiscalización y marca hitos para el art. 49 (antes de la orden de intervención, exención de multa).", "id": 218}, {"t": "mono", "q": "Paula tiene un kiosco, alquila un inmueble, es director de una S.A. y socio de una S.R.L. ¿Puede estar en el monotributo?", "o": ["Sí: el kiosco y el alquiler son actividades dentro del régimen; los ingresos como director o socio son ganancias paralelas y no cuentan para el tope ni la recategorización", "Solo si deja de alquilar", "No, por tener 4 fuentes", "No, por tener ingresos de sociedades"], "a": 0, "j": "Art. 12 DR. Los ingresos de director de S.A., socio de S.R.L., accionista, relación de dependencia, jubilación, beca, plazo fijo y venta de un inmueble no se toman en cuenta. Paula tiene dos actividades dentro del impuesto.", "id": 219}, {"t": "mono", "q": "¿Cuántas actividades puede tener un monotributista y cómo cuentan las sucursales?", "o": ["Se cuenta una sola aunque tenga sucursales", "Ilimitadas", "Hasta 3 explotaciones; cada sucursal o local cuenta como una explotación (superar 3 es causal de exclusión)", "Solo 1"], "a": 2, "j": "En el parcialito, Franco tiene una cafetería con 2 sucursales (cuentan 2) más el consultorio de psicología: 3 explotaciones, justo en el límite; las inversiones (plazo fijo), la venta de un inmueble y ser accionista no cuentan. Ejemplos: taxi hasta 3 móviles; locación hasta 6 unidades.", "id": 220}, {"t": "mono", "q": "Un importador, ¿puede ser monotributista?", "o": ["Solo si es persona jurídica", "Sí, siempre", "No, nunca ni siquiera personales", "No, si importa bienes relacionados con su actividad; sí si son cosas personales"], "a": 3, "j": "Art. 2 y 20: quien vende bienes e importa queda fuera porque se presume capital suficiente. Es causal de exclusión.", "id": 221}, {"t": "mono", "q": "Un monotributista con empleados:", "o": ["Puede tenerlos: no hay límite, pero lo facturado debe alcanzar para pagar los gastos del empleador y dejar una ganancia, para que no se lo considere una pantalla", "Solo uno", "Debe pasar a RI", "No puede tener empleados"], "a": 0, "j": "También puede ser jubilado y monotributista.", "id": 222}, {"t": "mono", "q": "Causales de exclusión (art. 20):", "o": ["Tener empleados", "Ser jubilado", "Superar topes, importar bienes en venta de cosas, más de 3 explotaciones, actividad contraria a la inscripta, gastos superiores a 20% (servicios) o 40% (venta de bienes) de los topes, ingresos bancarios incongruentes y gastos mayores que ingresos", "Tener una cuenta bancaria"], "a": 2, "j": "Excluido: no puede volver por 3 años calendario y queda en el régimen general (RI en IVA y Ganancias).", "id": 223}, {"t": "mono", "q": "Nadia presta servicios de asesoramiento por $9.300.000 y vende artículos de decoración por $3.500.000 en 12 meses. ¿Qué cuota corresponde?", "o": ["La menor siempre", "La suma de ambas", "La de ventas", "La de servicios, porque la actividad de servicios es mayor; si fuera mayor o solo venta de cosas muebles, la cuota de venta (más baja)"], "a": 3, "j": "Los ingresos se suman para categorizar; la cuota es la de servicios cuando la actividad de servicios es la mayor (parcialito: categoría C, $11.871,01 vs $10.901,95 para venta).", "id": 224}, {"t": "mono", "q": "Delma tuvo $1.300.000 en relación de dependencia, $1.400.000 como directora de S.A., $350.000 de beca y $1.250.000 por servicios independientes. ¿Qué ingresos cuentan para categorizarla?", "o": ["Solo los de la S.A.", "Solo los $1.250.000 de servicios independientes", "Todos", "Los de relación de dependencia"], "a": 1, "j": "Art. 12 DR: son ingresos de otras fuentes que no se toman en cuenta para recategorizar. Queda en la categoría A.", "id": 225}, {"t": "cml", "q": "¿Cuándo se aplica el Convenio Multilateral?", "o": ["Cuando un mismo contribuyente ejerce actividades en dos o más jurisdicciones y sus ingresos, por provenir de un proceso único económicamente inseparable, deben atribuirse conjuntamente a todas ellas", "Solo para importadores", "Cuando opera en una sola provincia", "Solo para sociedades"], "a": 0, "j": "Art. 1: aunque las actividades las ejerza por sí o por terceros (comisionistas, viajantes, intermediarios). Situaciones: industrialización en una jurisdicción y comercialización en otra; dirección y administración en una y etapas en otras; asiento principal en una y ventas o compras en otras; servicios a personas o bienes radicados en otras.", "id": 226}, {"t": "cml", "q": "El régimen general de distribución (art. 2) es:", "o": ["70% ingresos y 30% gastos", "100% por ingresos", "50% en proporción a los gastos efectivamente soportados en cada jurisdicción y 50% en proporción a los ingresos brutos provenientes de cada jurisdicción", "100% por gastos"], "a": 2, "j": "El resultado es el coeficiente unificado, que se aplica a la base imponible total para repartirla.", "id": 227}, {"t": "cml", "q": "¿Qué NO se computa como gasto para el CML (art. 3)?", "o": ["Combustibles y fuerza motriz", "Alquileres", "Sueldos y jornales", "El costo de la materia prima y de la mercadería, de obras o servicios contratados para comercializar, publicidad y propaganda, tributos, intereses y honorarios de directores/síndicos/socios que excedan 1% de la utilidad"], "a": 3, "j": "Sí computan: sueldos, jornales, combustibles, reparaciones, alquileres, seguros, gastos de compra, administración, producción, comercialización y amortizaciones ordinarias.", "id": 228}, {"t": "cml", "q": "¿Cuándo se considera 'soportado' un gasto en una jurisdicción (art. 4)?", "o": ["Donde se paga", "Donde está el proveedor", "Cuando tiene relación directa con la actividad que allí se desarrolla, aunque se pague en otra (ej.: sueldos en el lugar donde se prestan los servicios)", "Donde decide el contribuyente"], "a": 2, "j": "Los gastos no atribuibles con certeza pero de escasa significación se distribuyen en la misma proporción que los demás; si no, estimación razonablemente fundada. Los de transporte se atribuyen por partes iguales a las jurisdicciones entre las que se realice el hecho imponible.", "id": 229}, {"t": "cml", "q": "¿Qué período se usa para calcular el coeficiente (art. 5)?", "o": ["Los del último mes", "Los del año en curso", "Los últimos 3 años", "Los ingresos y gastos del último balance cerrado en el año calendario inmediato anterior; sin balance comercial, los del año calendario anterior"], "a": 3, "j": "Por eso el coeficiente es anual y se aplica a los ingresos del año siguiente.", "id": 230}, {"t": "cml", "q": "Ejercicio: Viviana (contadora) tiene ingresos en Entre Ríos $2.500.000, Corrientes $500.000 y Misiones $200.000; gastos de impuestos ER 50.000, Corr 25.000, Mis 10.000; otros gastos ER 250.000, Corr 5.000, Mis 1.000. ¿Coeficiente unificado de Entre Ríos?", "o": ["0,5000", "0,8789 (ingresos 0,78125 y gastos computables 0,9765; los impuestos no computan)", "0,7813", "0,9766"], "a": 1, "j": "Gastos computables: 250.000 / 256.000 = 0,9765625. Ingresos: 2.500.000 / 3.200.000 = 0,78125. Coeficiente = (0,78125 + 0,9765625) / 2 = 0,87890625. Corrientes: 0,0879; Misiones: 0,0332. Suman 1.", "id": 231}, {"t": "cml", "q": "Si una empresa tiene ingresos ER $2.000.000 y Santa Fe $2.000.000 y gastos computables ER $300.000 y Santa Fe $100.000, ¿coeficiente de Santa Fe?", "o": ["0,25", "0,375", "0,5", "0,125"], "a": 1, "j": "Ingresos SF: 0,5. Gastos SF: 100.000/400.000 = 0,25. (0,5 + 0,25)/2 = 0,375.", "id": 232}, {"t": "sellos", "q": "¿Qué grava el Impuesto de Sellos?", "o": ["Actos, contratos y operaciones de carácter oneroso instrumentados, contratos formalizados por correspondencia y operaciones monetarias de entidades financieras con interés", "El consumo", "Los ingresos de las empresas", "El patrimonio"], "a": 0, "j": "Es un impuesto provincial y documental (art. 9 Ley de Coparticipación y Código Fiscal de Entre Ríos).", "id": 233}, {"t": "sellos", "q": "Instrumento, a los fines del impuesto:", "o": ["Cualquier mail", "Solo contratos de compraventa", "Solo la escritura pública", "Toda escritura, papel o documento del que surja el perfeccionamiento del acto y que reviste los caracteres de título jurídico por el cual puede exigirse el cumplimiento sin necesidad de otro documento"], "a": 3, "j": "El HI es la instrumentación, con prescindencia de los actos que efectivamente realicen las partes. Por eso un contrato no instrumentado no configura el HI.", "id": 234}, {"t": "sellos", "q": "Un contrato celebrado en Santa Fe que debe cumplir efectos en Entre Ríos:", "o": ["Queda exento", "No puede gravarse", "Solo se grava en Santa Fe", "Puede quedar gravado en Entre Ríos: el impuesto alcanza lo concertado en la jurisdicción y lo celebrado en otra que deba cumplir efectos en ella"], "a": 3, "j": "La coparticipación exige cláusulas para evitar la doble imposición interna.", "id": 235}, {"t": "sellos", "q": "Una persona firma un alquiler comercial por 24 meses con $600.000 mensuales. ¿Por qué puede quedar alcanzado?", "o": ["Porque es un bien de uso", "No queda alcanzado", "Porque es un acto oneroso instrumentado; contribuyentes son las partes, y si no se presenta ante ATER puede haber multas, intereses y determinación de oficio", "Porque es un servicio"], "a": 2, "j": "Ejercicio 5 de la cátedra. La instrumentación escrita permite configurar el HI.", "id": 236}, {"t": "sellos", "q": "Una concesionaria vende un automóvil por $28.000.000 y el valor fiscal es mayor. ¿Qué base imponible se toma?", "o": ["El mayor valor (el valor fiscal), para evitar la subdeclaración y la evasión; controla ATER", "El declarado siempre", "El menor", "El promedio"], "a": 0, "j": "Ejercicio 6 de la cátedra.", "id": 237}, {"t": "sellos", "q": "¿Cuáles de estos contratos podrían estar alcanzados: mutuo, locación, cesión gratuita, leasing?", "o": ["Mutuo, locación y leasing; la cesión gratuita podría no devengar impuesto en ciertos casos", "Todos", "Ninguno", "Solo el leasing"], "a": 0, "j": "El monto determina la base imponible; si produce efectos en Entre Ríos puede quedar gravado.", "id": 238}, {"t": "sellos", "q": "Exenciones del impuesto de sellos (ejercicio 7):", "o": ["Solo los bancarios", "Todos los contratos entre particulares", "Ninguno", "Municipalidad y Estado provincial exentos (art. 245 Código Fiscal); contrato entre particulares: en principio no; asociación civil sin fines de lucro: según requisitos legales"], "a": 3, "j": "Por sujeto y por objeto. Plazo de pago (apunte manuscrito): 15 días; 60 días si el instrumento se otorga en el exterior. Hay agentes de retención/percepción designados y solidaridad entre las partes.", "id": 239}, {"t": "dyc", "q": "Hecho imponible del impuesto a los débitos y créditos bancarios:", "o": ["La compra de acciones", "Créditos y débitos efectuados en cuentas abiertas en entidades financieras y movimientos de fondos por sistemas de pago", "El patrimonio", "Los intereses bancarios"], "a": 1, "j": "Art. 1 Ley 25.413. Nace en el momento del crédito o débito. Alcanza depósitos, transferencias, pagos y otros movimientos. Base: importe total de cada movimiento.", "id": 240}, {"t": "dyc", "q": "Una empresa tiene un depósito de $2.500.000, un pago a proveedor de $900.000 y una transferencia entre cuentas propias de $300.000. ¿Qué genera impuesto?", "o": ["Nada", "Solo los depósitos", "Solo los pagos", "Los créditos y débitos (depósito y pago); la transferencia entre cuentas propias puede estar sujeta a la regla específica de la ley"], "a": 3, "j": "Ejercicio 2 de la cátedra: generan impuesto tanto créditos como débitos; solo para cuentas abiertas en entidades financieras alcanzadas. Crédito: ingreso de dinero; débito: egreso.", "id": 241}, {"t": "dyc", "q": "Con alícuota de 6‰ para débitos y créditos, un débito de $1.800.000 y un crédito de $850.000 generan:", "o": ["$26.500", "$10.800 + $5.100 = $15.900", "$15.900 al 12‰", "$8.500"], "a": 1, "j": "1.800.000 × 0,006 = 10.800; 850.000 × 0,006 = 5.100.", "id": 242}, {"t": "dyc", "q": "Rol del banco:", "o": ["Sujeto activo", "Agente de liquidación y percepción: percibe al titular e ingresa a ARCA; el titular soporta el impuesto", "Contribuyente", "Sujeto exento"], "a": 1, "j": "Se llama 'impuesto al cheque' porque originalmente grababa operaciones vinculadas a cheques y movimientos bancarios. Ingreso por recaudación automática.", "id": 243}, {"t": "dyc", "q": "Exenciones o reducciones:", "o": ["Solo para personas humanas", "Solo para bancos extranjeros", "Existen para ciertos sujetos y actividades (cuentas del Estado, BCRA, movimientos entre entidades financieras); se justifican por fomento económico o menor capacidad contributiva; ARCA administra los registros de beneficios", "No existen"], "a": 2, "j": "Decreto 380/01 y reglamentaciones.", "id": 244}, {"t": "int", "q": "Diferencia entre IVA e impuestos internos:", "o": ["IVA grava el consumo en general en todas las etapas; los internos gravan consumos específicos (tabaco, bebidas alcohólicas, electrónicos) y son monofásicos", "El IVA es monofásico", "Los internos gravan todo consumo", "No hay diferencia"], "a": 0, "j": "Finalidad recaudatoria y extrafiscal: desalentar ciertos consumos. Ley 24.674.", "id": 245}, {"t": "int", "q": "Monofásico significa:", "o": ["Se aplica en una sola etapa (fabricante o importador); contribuyente de derecho: quien lo paga jurídicamente; de hecho: quien soporta económicamente la carga (consumidor final), trasladada al precio", "Es provincial", "Se aplica en todas las etapas", "Solo lo paga el consumidor"], "a": 0, "j": "Sellos es provincial; débitos y créditos e internos son nacionales.", "id": 246}, {"t": "int", "q": "Una empresa vende whisky, vino y gaseosas. ¿Todos pagan internos y por qué hay distinta carga?", "o": ["Todos igual", "No necesariamente: la carga varía por razones sanitarias o fiscales; el Estado busca desalentar ciertos consumos o aumentar recaudación; la soporta el consumidor final", "Ninguno", "Solo el vino"], "a": 1, "j": "Ejercicio 10 de la cátedra.", "id": 247}, {"t": "int", "q": "Una empresa firma leasing en Entre Ríos, opera con cuentas bancarias y vende bebidas alcohólicas. ¿Qué impuestos intervienen y quiénes los administran?", "o": ["Sellos (provincial, ATER), débitos y créditos (nacional, ARCA) e internos (nacional, ARCA)", "Solo Sellos", "Solo IVA", "Ganancias y Bienes Personales"], "a": 0, "j": "HI: instrumentación contractual (sellos), movimientos bancarios (cheque), venta de productos gravados (internos). Sellos grava actos jurídicos; el cheque, movimientos; los internos, consumos específicos.", "id": 248}, {"t": "casos", "q": "Vendés $200.000 netos y comprás $120.000 netos, ambos con IVA 21%. ¿Cuánto IVA pagás?", "o": ["$25.200", "$42.000", "$8.400", "$16.800"], "a": 3, "j": "DF 42.000 − CF 25.200.", "id": 249}, {"t": "casos", "q": "Una factura total de $242.000 incluye IVA 21%. ¿Cuál es el IVA?", "o": ["$21.000", "$50.820", "$24.200", "$42.000"], "a": 3, "j": "Neto 200.000; IVA 42.000.", "id": 250}, {"t": "casos", "q": "Ventas gravadas $600.000 y exentas $400.000; CF de insumos comunes $50.000. CF computable:", "o": ["$30.000", "$20.000", "$25.000", "$50.000"], "a": 0, "j": "60% × 50.000.", "id": 251}, {"t": "casos", "q": "Comisionista: vende por cuenta de Juan $100.000 netos con comisión del 10%. ¿Cuál es su posición neta de IVA?", "o": ["$18.900", "$2.100", "$21.000", "$23.100"], "a": 1, "j": "DF por la venta 21.000 − CF por la liquidación al comitente 18.900 = 2.100.", "id": 252}, {"t": "casos", "q": "Un saldo de IVA vence el 19/05 y se paga el 05/07 con interés mensual del 3% (resarcitorios simples): ¿qué se debe por mora de 47 días sobre $25.000, aproximadamente?", "o": ["$0", "$2.500", "≈ $1.175 de intereses (25.000 × 3% × 47/30)", "$750"], "a": 2, "j": "Los resarcitorios corren desde el día siguiente al vencimiento sin necesidad de intimación (art. 37).", "id": 253}, {"t": "casos", "q": "En el caso de la empresa que debe un impuesto, ¿qué diferencia hay entre el plazo para apelar al TFN una DO y el plazo para pagar la deuda determinada?", "o": ["5 días para ambos", "Apelar: 15 días hábiles; pagar: 15 días desde la notificación de la resolución", "No hay plazos", "30 días para ambos"], "a": 1, "j": "Si no se recurre ni se paga, queda firme y desde el día 16 puede iniciarse ejecución fiscal.", "id": 254}, {"t": "ivaesp", "q": "Una empresa exporta mercadería y tiene CF de $30.000 de sus compras vinculadas, sin débito fiscal. ¿Qué derecho tiene?", "o": ["Ninguno, porque exportar está no alcanzado", "Perder el crédito", "Recuperar ese crédito fiscal (compensación o devolución) por el art. 43; es saldo de libre disponibilidad en la medida del recupero", "Solo computarlo contra ventas futuras locales"], "a": 2, "j": "La exportación está exenta/tasa cero por criterio de destino, pero con derecho a recupero del IVA contenido en las compras vinculadas. Si la exportación fuera 'no alcanzada' no habría derecho a recupero; por eso se la trata como hecho imponible con tratamiento especial.", "id": 255}, {"t": "ivaesp", "q": "Un RI vende $100.000 netos con 21% y luego otorga una bonificación general por volumen de $12.100 (IVA incluido). ¿Cómo reduce el débito fiscal?", "o": ["Resta const app=document.getElementById('app');
let st={ids:[],i:0,ok:0,ans:0,done:false,label:''};
function shuf(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function menu(){
 app.innerHTML=`<h1>📚 Impuestos II – Juego de estudio</h1><div class="sub">${QS.length} preguntas en ${TOPICS.length} temas. Elegí una opción y después tocá "Justificación".</div>
 <div class="row"><button class="b" onclick="start(null)">🎲 Todas mezcladas</button></div><div class="grid">`+
 TOPICS.map(t=>{const n=QS.filter(q=>q.t===t.id).length;return `<button class="tcard" onclick="start('${t.id}')"><b>${t.icon} ${t.name}</b><small>${n} preguntas · ${t.desc}</small></button>`}).join('')+`</div>`;
}
function start(t){const pool=t?QS.filter(q=>q.t===t):QS;st={ids:shuf(pool.map(q=>q.id)),i:0,ok:0,ans:0,done:false,label:t?TOPICS.find(x=>x.id===t).name:'Todas mezcladas'};show()}
function show(){
 if(st.i>=st.ids.length){app.innerHTML=`<div class="q"><h1>🏁 Terminaste: ${st.label}</h1><p>Acertaste <b>${st.ok}</b> de <b>${st.ids.length}</b> (${Math.round(100*st.ok/st.ids.length)}%).</p><div class="row"><button class="b" onclick="start(null)">Jugar todo mezclado</button><button class="b g" onclick="menu()">Volver a temas</button></div></div>`;return}
 const q=QS[st.ids[st.i]];const T=TOPICS.find(t=>t.id===q.t);st.done=false;
 const order=q.vf?q.o.map((_,k)=>k):shuf(q.o.map((_,k)=>k));
 app.innerHTML=`<div class="row"><button class="b g" onclick="menu()">← Temas</button><div class="bar"><i style="width:${100*st.i/st.ids.length}%"></i></div><span class="stat">${st.i+1}/${st.ids.length} · ✔ ${st.ok}</span></div>
 <div class="q"><div class="tag">${T.icon} ${T.name}</div><div class="qt">${q.q}</div><div id="opts">`+
 order.map(k=>`<button class="opt" data-k="${k}">${q.o[k]}</button>`).join('')+
 `</div><div id="res" class="res"></div><div class="row hide" id="act"><button class="b g" onclick="document.getElementById('just').classList.toggle('hide')">💡 Justificación</button><button class="b" onclick="st.i++;show()">Siguiente →</button></div><div id="just" class="just hide">${q.j}</div></div>`;
 document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(q,+b.dataset.k));
}
function answer(q,k){
 if(st.done)return;st.done=true;st.ans++;const good=k===q.a;if(good)st.ok++;
 document.querySelectorAll('.opt').forEach(b=>{b.disabled=true;const x=+b.dataset.k;if(x===q.a)b.classList.add('ok');else if(x===k)b.classList.add('ko')});
 const r=document.getElementById('res');r.className='res '+(good?'ok':'ko');r.textContent=good?'✅ ¡Correcto!':'❌ Incorrecto';
 document.getElementById('act').classList.remove('hide');
}
menu();
</script></body></html>
