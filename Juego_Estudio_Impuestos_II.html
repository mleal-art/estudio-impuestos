<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Impuestos II – Juego de estudio</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#1d2433;--mut:#667085;--pri:#3b5bdb;--ok:#2b8a3e;--okb:#ebfbee;--ko:#c92a2a;--kob:#fff5f5;--bd:#e3e7f0}
@media(prefers-color-scheme:dark){:root{--bg:#12151c;--card:#1b2030;--ink:#e8ebf3;--mut:#9aa3b5;--pri:#7c9cff;--ok:#69db7c;--okb:#16301f;--ko:#ff8787;--kob:#35191b;--bd:#2c3347}}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
.wrap{max-width:820px;margin:0 auto;padding:16px}
h1{font-size:1.5rem;margin:8px 0}.sub{color:var(--mut);margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.tcard{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;cursor:pointer;text-align:left;color:inherit;font:inherit}
.tcard:hover{border-color:var(--pri)}.tcard b{display:block}.tcard small{color:var(--mut)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0;align-items:center}
button.b{background:var(--pri);color:#fff;border:0;border-radius:8px;padding:10px 16px;font:inherit;cursor:pointer}
button.g{background:transparent;color:var(--pri);border:1px solid var(--pri)}
.bar{height:8px;background:var(--bd);border-radius:4px;overflow:hidden;flex:1;min-width:120px}.bar i{display:block;height:100%;background:var(--pri)}
.q{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px}
.tag{font-size:.8rem;color:var(--mut)}.qt{font-size:1.15rem;font-weight:600;margin:8px 0 14px}
.opt{display:block;width:100%;text-align:left;background:var(--bg);color:inherit;border:2px solid var(--bd);border-radius:10px;padding:12px;margin:8px 0;font:inherit;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--pri)}.opt.ok{border-color:var(--ok);background:var(--okb)}.opt.ko{border-color:var(--ko);background:var(--kob)}
.opt:disabled{cursor:default}
.just{margin-top:12px;border-left:4px solid var(--pri);background:var(--bg);padding:12px;border-radius:8px}
.res{font-weight:700;margin-top:10px}.res.ok{color:var(--ok)}.res.ko{color:var(--ko)}
.hide{display:none}.stat{display:flex;gap:16px;font-size:.95rem;color:var(--mut)}
</style></head><body><div class="wrap" id="app"></div>
<script>
const TOPICS=[{"id": "princ", "name": "Derecho Tributario y Principios Constitucionales", "icon": "⚖️", "desc": "Tributos, capacidad contributiva, legalidad, igualdad, autonomía, obligación tributaria"}, {"id": "pot", "name": "Potestades Tributarias, Doble Imposición y Sistema Tributario", "icon": "🏛️", "desc": "Nación, provincias, coparticipación, convenios internacionales"}, {"id": "proc", "name": "Proceso, Procedimiento y Acto Administrativo", "icon": "📑", "desc": "Jurisdicción, principios, debido proceso adjetivo, elementos del acto, recursos"}, {"id": "ivag", "name": "IVA: concepto, mecánica y determinación", "icon": "🧮", "desc": "Valor agregado, impuesto contra impuesto, criterios, destino, saldos"}, {"id": "ivahi", "name": "IVA: hecho imponible, venta y sujetos (arts. 1 a 4)", "icon": "🧾", "desc": "Objeto, concepto de venta, comisionistas, habitualidad, construcción, importación"}, {"id": "ivanac", "name": "IVA: nacimiento del hecho imponible (arts. 5 y 6)", "icon": "⏱️", "desc": "Cuándo se perfecciona el HI según el tipo de operación"}, {"id": "ivaex", "name": "IVA: exenciones, no gravado y exclusiones (arts. 7 y 8)", "icon": "🛡️", "desc": "Gravado vs exento vs no gravado, exenciones objetivas y subjetivas, complementariedad"}, {"id": "ivadf", "name": "IVA: base imponible, débito, crédito fiscal y prorrateo (arts. 10 a 24)", "icon": "📊", "desc": "Débito fiscal, devoluciones, CF y presunciones, prorrateo, bienes usados, casos especiales"}, {"id": "ivaesp", "name": "IVA: sujetos, regímenes y casos de aplicación", "icon": "🧰", "desc": "Inscripción, comprobantes, retenciones, ejercicios resueltos"}, {"id": "pf", "name": "Procedimiento Fiscal: DDJJ, actas, notificaciones y secreto fiscal", "icon": "🗂️", "desc": "Autodeterminación, actas, art. 100, secreto fiscal, responsables"}, {"id": "detof", "name": "Determinación de Oficio: etapas, base cierta/presunta y efectos", "icon": "🔎", "desc": "Arts. 16 a 19: vista, plazos, caducidad, presunciones y cosa juzgada"}, {"id": "rec", "name": "Recursos, Tribunal Fiscal y Ejecución Fiscal", "icon": "⚔️", "desc": "Art. 76 LPF, art. 77/78, TFN, repetición, ejecución fiscal"}, {"id": "presc", "name": "Prescripción", "icon": "⏳", "desc": "Art. 56 y 57, suspensión, interrupción y casos prácticos"}, {"id": "sanc", "name": "Intereses, infracciones y sanciones (Ley 11.683)", "icon": "🚨", "desc": "Arts. 37, 38, 45–50, 52, clausura, non bis in idem"}, {"id": "penal", "name": "Régimen Penal Tributario", "icon": "👮", "desc": "Infracciones vs delitos, principios, dolo, arts. 1 a 7, denuncia y extinción"}, {"id": "mono", "name": "Monotributo", "icon": "🪙", "desc": "Quién puede adherir, qué ingresos cuentan, exclusiones y recategorización"}, {"id": "cml", "name": "Convenio Multilateral (Ingresos Brutos)", "icon": "🗺️", "desc": "Arts. 1 a 5, coeficiente unificado, ejercicios"}, {"id": "sellos", "name": "Impuesto de Sellos (Entre Ríos - ATER)", "icon": "🖋️", "desc": "Instrumentación, territorialidad, contribuyentes, base, exenciones"}, {"id": "dyc", "name": "Impuesto sobre los Débitos y Créditos Bancarios (Ley 25.413)", "icon": "🏦", "desc": "El \"impuesto al cheque\""}, {"id": "int", "name": "Impuestos Internos (Ley 24.674)", "icon": "🥃", "desc": "Selectivos al consumo, monofásicos"}, {"id": "casos", "name": "Casos prácticos de cálculo", "icon": "🧪", "desc": "Ejercicios de aplicación con números"}];const QS=[{"t": "princ", "q": "Una persona paga la matrícula de una universidad pública y la cuota de un servicio de agua. ¿Qué tributo es cada uno?", "o": ["Multas, porque son obligatorios", "Impuestos, porque pagan al Estado", "Ambos suelen estudiarse como precios/tasas: hay un servicio estatal específico y divisible que beneficia individualmente al que paga", "Contribuciones especiales, porque hay un beneficio general"], "a": 2, "j": "Tasa: tributo que se paga por un servicio efectivo, divisible y prestado por el Estado (contraprestación directa). Impuesto: sin contraprestación directa, se justifica por capacidad contributiva. Contribución especial: beneficio particular derivado de una obra pública (contribución por mejoras). Tu recuperatorio distingue además precio privado (lo fija una empresa por oferta y demanda), precio público (cobrado por el Estado por servicios públicos, regulado) y precio cuasiprivado (el Estado cobra un servicio individual sin llamarlo tasa).", "id": 0}, {"t": "princ", "q": "Una calle se asfalta y los vecinos frentistas pagan un monto porque sus inmuebles se valorizan. Es:", "o": ["Una tasa", "Un impuesto directo", "Un precio privado", "Una contribución especial (contribución por mejoras)"], "a": 3, "j": "La clave es el beneficio particular que recibe el contribuyente por una obra pública. No es tasa porque no hay un servicio prestado al individuo, sino una obra; no es impuesto porque hay beneficio específico.", "id": 1}, {"t": "princ", "q": "¿Qué exige el principio de legalidad respecto de los elementos esenciales del tributo?", "o": ["Que lo defina un decreto del PE", "Que una ley formal del Congreso defina hecho imponible, sujeto activo y pasivo, base imponible, alícuota, exenciones, infracciones y sanciones", "Que lo defina una resolución general", "Que solo defina la alícuota y lo demás lo fije ARCA"], "a": 1, "j": "Es el límite formal: solo el Congreso crea tributos (arts. 4, 17, 52 y 75 CN). CSJN: cobrar un impuesto sin ley es un despojo (Fallos 118:411). Los DNU no pueden regular materia tributaria (art. 99 inc. 3 CN).", "id": 2}, {"t": "princ", "q": "Capacidad contributiva: ¿cómo se mide según la doctrina que viste?", "o": ["Por la residencia del contribuyente", "Por la cantidad de actividades", "Renta bruta menos lo necesario para la subsistencia, ahorro y capitalización; se exterioriza por ingresos (Ganancias), patrimonio (Bienes Personales) y consumo (IVA)", "Solo por el patrimonio"], "a": 2, "j": "No hay capacidad contributiva cuando los ingresos apenas cubren las necesidades básicas del contribuyente y su familia. A mayor capacidad, mayor tributación, y el tributo no puede absorber la capacidad misma. Es un principio implícito en la CN (arts. 4, 16 y 17).", "id": 3}, {"t": "princ", "q": "En el ejemplo del examen: dos personas compran el mismo producto gravado con IVA, una de ingresos altos y otra de ingresos medios. ¿Qué ilustra esto?", "o": ["Que el IVA es un impuesto directo", "Que el mismo monto de IVA representa una carga relativa mayor para quien tiene menos ingresos: el IVA tiende a ser regresivo", "Que el IVA es progresivo", "Que el IVA viola la legalidad"], "a": 1, "j": "Los impuestos al consumo tienen alícuota uniforme, por eso los hogares de menores ingresos destinan una proporción mayor de su renta. Se mitiga con exenciones y alícuotas reducidas sobre la canasta básica. También: estimulan el ahorro, se trasladan al precio y distorsionan la demanda hacia bienes exentos.", "id": 4}, {"t": "princ", "q": "El principio de igualdad del art. 16 CN ('la igualdad es la base del impuesto y de las cargas públicas') significa:", "o": ["Que no pueden existir exenciones", "Que solo aplica a los impuestos nacionales", "Igual trato a quienes están en iguales circunstancias; las diferencias deben fundarse en diferencias objetivas de capacidad económica, no en discriminación arbitraria", "Que todos paguen el mismo monto"], "a": 2, "j": "No es igualdad aritmética. Se trata igual a los iguales y distinto a quienes presentan diferencias reales. La generalidad (todo el que tiene capacidad contribuye) se limita con las exenciones.", "id": 5}, {"t": "princ", "q": "Una carga es confiscatoria cuando:", "o": ["Supera el 21%", "Lo cobra la Nación y no la provincia", "Se cobra con intereses", "Absorbe una parte sustancial de la renta o del capital, ya sea por un solo tributo o por la suma de varios"], "a": 3, "j": "Se funda en el art. 17 CN (inviolabilidad de la propiedad y abolición de la confiscación). No hay un porcentaje único: se analiza caso por caso.", "id": 6}, {"t": "princ", "q": "La progresividad de un impuesto, ¿contradice el principio de proporcionalidad?", "o": ["Solo si supera el 30%", "No: la proporcionalidad es graduada y la progresividad se funda en la solidaridad social; lo que importa es la relación razonable con la capacidad económica", "Sí, pero solo en impuestos indirectos", "Sí, y por eso es inconstitucional"], "a": 1, "j": "La CSJN no exige proporcionalidad rígida. Una alícuota que crece con la base puede respetar la capacidad contributiva.", "id": 7}, {"t": "princ", "q": "La 'autonomía dogmática' del derecho tributario significa que:", "o": ["No se relaciona con otras ramas", "Se rige solo por el derecho civil", "Elabora sus propios conceptos, aunque se relacione con otras ramas (civil, comercial, penal)", "No tiene principios propios"], "a": 2, "j": "Ejemplos: el concepto de 'venta' del IVA (art. 2) es más amplio que el civil (no exige ánimo de lucro ni solo compraventa); las presunciones fiscales (art. 18) admiten más fácilmente indicios que el derecho penal o civil.", "id": 8}, {"t": "princ", "q": "Diferencia entre derecho tributario sustantivo y formal:", "o": ["Sustantivo es la Ley 11.683 y formal la Ley de IVA", "Formal crea los tributos", "Son sinónimos", "Sustantivo: crea el tributo y regula nacimiento, efectos y extinción de la obligación (hecho imponible, sujetos, base, alícuota). Formal: regula la aplicación y recaudación (DDJJ, fiscalización, determinación de oficio, recursos, sanciones)"], "a": 3, "j": "Ley de IVA / Ganancias → sustantivo. Ley 11.683 y sus resoluciones → formal o procedimental.", "id": 9}, {"t": "princ", "q": "El derecho tributario respecto del derecho financiero:", "o": ["Regula solo el gasto público", "Está dentro del derecho financiero, que regula toda la actividad financiera del Estado (obtención de ingresos, gestión y gasto)", "Es una rama independiente sin relación", "Es el derecho penal fiscal"], "a": 1, "j": "Característica fundamental de la actividad financiera: la obtención de ingresos. El derecho tributario se ocupa de los ingresos tributarios.", "id": 10}, {"t": "princ", "q": "¿Qué da nacimiento a la obligación tributaria?", "o": ["La intimación de ARCA", "La determinación de oficio", "La DDJJ", "La realización del hecho imponible previsto en la ley"], "a": 3, "j": "El HI es el acto o conjunto de actos de naturaleza económica previstos en la norma cuya configuración origina la relación jurídica principal. Es un error invertir el orden (primero la obligación y luego el HI).", "id": 11}, {"t": "princ", "q": "¿Quién es sujeto pasivo por deuda propia (contribuyente) y quién por deuda ajena (responsable)?", "o": ["Solo existen contribuyentes", "Los agentes de retención son contribuyentes", "Contribuyente: realiza el HI. Responsables: agentes de retención y percepción, representantes, administradores (art. 6 y 8 Ley 11.683)", "Los administradores de las empresas son contribuyentes"], "a": 2, "j": "Los administradores de las empresas NO son contribuyentes: responden solidariamente como responsables por deuda ajena. Además, el sujeto pasivo de la obligación tributaria no siempre coincide con el sujeto pasivo del tributo, y los menores de edad sí pueden ser contribuyentes (personas de existencia visible, capaces o incapaces, según el derecho común).", "id": 12}, {"t": "princ", "q": "¿Cuál es el objeto de la obligación tributaria?", "o": ["La fuente de riqueza que se afecta", "El domicilio fiscal", "La prestación de dar una suma de dinero (el tributo) al Estado; no es la fuente de riqueza afectada", "Un acto que el deudor debe realizar a beneficio del Fisco"], "a": 2, "j": "Típico verdadero/falso de tu examen: 'El objeto de la obligación es la fuente de riqueza que se afecta mediante el tributo' es FALSO. La fuente de riqueza es el objeto del tributo/hecho imponible, no el objeto de la obligación.", "id": 13}, {"t": "princ", "q": "Medios de extinción de la obligación tributaria que viste: ¿cuál NO corresponde?", "o": ["Pago", "Prescripción", "Compensación", "La novación por voluntad de las partes sin previsión legal"], "a": 3, "j": "Se extingue por pago, compensación, prescripción, condonación/remisión (por ley) y confusión. La novación, dación en pago o transacción no extinguen tributos a menos que la ley lo establezca expresamente.", "id": 14}, {"t": "pot", "q": "¿Cómo se reparte el poder tributario entre Nación y provincias?", "o": ["Nación: derechos de importación y exportación (exclusivo y permanente); indirectos: concurrente; directos: provincias, y la Nación solo de modo excepcional y transitorio. Provincias: directos e indirectos concurrentes (arts. 4, 9, 75 inc. 1 y 2 y 121 CN)", "Nación: todos los tributos; provincias: solo tasas", "Provincias: aduana; Nación: impuestos directos permanentes", "Todo concurrente sin excepciones"], "a": 0, "j": "Los impuestos directos nacionales solo proceden por tiempo determinado y cuando la defensa, seguridad común y bien general lo exijan, y deben ser proporcionalmente iguales en todo el territorio. Las provincias conservan todo el poder no delegado (art. 121).", "id": 15}, {"t": "pot", "q": "¿Qué problema trae el ejercicio conjunto de distintos poderes tributarios?", "o": ["La doble (o múltiple) imposición", "La falta de legalidad", "La prescripción", "La caducidad"], "a": 0, "j": "Cuando varios fiscos pueden gravar la misma manifestación de riqueza se superponen. Doble imposición INTERNA: Nación-provincias o entre provincias; INTERNACIONAL: entre Estados.", "id": 16}, {"t": "pot", "q": "La coparticipación federal (Ley convenio, art. 75 inc. 2 y 3 CN) es un remedio para:", "o": ["La prescripción de las acciones", "La superposición de poderes tributarios internos entre Nación y provincias", "La doble imposición internacional", "La evasión penal"], "a": 1, "j": "Trampa de tu examen: 'La coparticipación es el remedio para evitar la múltiple imposición internacional' es FALSO. Para lo internacional se usan los convenios para evitar la doble imposición, que permiten por ejemplo computar el impuesto pagado en el exterior contra el impuesto determinado en el país de origen (esto último es VERDADERO).", "id": 17}, {"t": "pot", "q": "El Convenio Multilateral resuelve:", "o": ["La coparticipación del impuesto a las ganancias", "La doble imposición interna entre provincias en Ingresos Brutos, distribuyendo la base entre las jurisdicciones", "El pago del IVA en el exterior", "La doble imposición internacional"], "a": 1, "j": "Es un acuerdo interprovincial: el contribuyente que realiza un proceso único e inseparable en más de una jurisdicción distribuye sus ingresos con un coeficiente unificado.", "id": 18}, {"t": "pot", "q": "¿Qué tributos son provinciales?", "o": ["Derechos de exportación", "IVA, Ganancias y Monotributo", "Débitos y créditos bancarios e internos", "Ingresos Brutos, Sellos, Inmobiliario y Automotor"], "a": 3, "j": "Nacionales: IVA, Ganancias, Bienes Personales, Monotributo, internos, débitos y créditos bancarios, derechos aduaneros. Provinciales: los anteriores. Municipales: tasas por servicios locales.", "id": 19}, {"t": "pot", "q": "La ley de coparticipación dispone para el Impuesto de Sellos que:", "o": ["Recae sobre actos, contratos y operaciones onerosos instrumentados, y alcanza lo concertado en la jurisdicción o lo que deba cumplir efectos en ella, con cláusulas para evitar la doble imposición", "Solo grava la compra de inmuebles", "Es nacional", "Grava el patrimonio de las sociedades"], "a": 0, "j": "Art. 9 inc. b de la Ley de Coparticipación Federal: también contratos a título oneroso formalizados por correspondencia y operaciones monetarias de entidades financieras que devenguen interés.", "id": 20}, {"t": "pot", "q": "En el sistema tributario, los gastos bancarios respecto del IVA:", "o": ["Están exentos siempre", "Están gravados (no exentos): los servicios financieros no están exentos de IVA por regla general", "Tributan solo si el cliente es consumidor final", "No son operaciones alcanzadas"], "a": 1, "j": "Verdadero/falso de tu examen: 'Los gastos bancarios se encuentran exentos de IVA' es FALSO. Distinto es el impuesto a los débitos y créditos bancarios, que es otro tributo.", "id": 21}, {"t": "proc", "q": "Jurisdicción, proceso y procedimiento:", "o": ["La jurisdicción son las formas del juicio", "El procedimiento es la potestad de juzgar", "Proceso y procedimiento son sinónimos", "Jurisdicción: potestad estatal de administrar justicia; proceso: relación jurídica/instrumento para resolver el conflicto; procedimiento: conjunto ordenado de actos con que el proceso se desarrolla"], "a": 3, "j": "La jurisdicción se ejerce a través del proceso y este se exterioriza en el procedimiento.", "id": 22}, {"t": "proc", "q": "Según el principio dispositivo (procesal), la iniciativa y el impulso corresponden a:", "o": ["ARCA", "Las partes", "El fiscal", "El juez"], "a": 1, "j": "En el procedimiento administrativo, en cambio, rige la oficialidad (impulso de oficio). Principio de bilateralidad: nadie puede ser condenado sin ser oído.", "id": 23}, {"t": "proc", "q": "El principio por el cual nadie puede ser sometido dos veces a proceso por los mismos hechos es:", "o": ["Proporcionalidad", "Non bis in idem", "In dubio pro reo", "Razonabilidad de la pena"], "a": 1, "j": "In dubio pro reo: la duda favorece al imputado. Proporcionalidad: la pena debe ser proporcional al delito y a los iguales igual pena.", "id": 24}, {"t": "proc", "q": "Preclusión significa que:", "o": ["No hay plazos", "Se puede reabrir cualquier etapa", "El proceso caduca automáticamente", "Las etapas se clausuran progresivamente y no se puede retroceder a una ya cumplida"], "a": 3, "j": "Ejemplo tributario: la prueba se ofrece con el descargo en la vista; después es tarde.", "id": 25}, {"t": "proc", "q": "Elementos esenciales del acto administrativo (art. 7 LPA):", "o": ["Competencia, causa, objeto, procedimiento, motivación, finalidad y forma", "Solo forma y fecha", "Competencia, dolo y culpa", "Objeto, precio y plazo"], "a": 0, "j": "Causa: hechos y antecedentes. Objeto: cierto, física y jurídicamente posible. Procedimiento: trámites previos incluida la audiencia del interesado y dictamen jurídico previo cuando afecte derechos. Motivación: razones concretas. Finalidad: la de las normas, sin fines encubiertos.", "id": 26}, {"t": "proc", "q": "El debido proceso adjetivo comprende:", "o": ["Derecho a ser oído, a ofrecer y producir prueba, a una decisión fundada y a un plazo razonable", "Solo el derecho de apelar", "Solo la gratuidad", "La eliminación de plazos"], "a": 0, "j": "Ser oído: argumentos, recursos, patrocinio, conocer las actuaciones. Prueba: propuesta, producción antes de la decisión, alegatos. Decisión fundada: que considere los principales argumentos y pruebas. Plazo razonable. Se vincula con la tutela administrativa efectiva.", "id": 27}, {"t": "proc", "q": "El 'informalismo' en el procedimiento administrativo:", "o": ["Elimina toda forma", "Beneficia a la Administración", "Solo vale en sede judicial", "Beneficia al administrado: se excusan defectos formales menores; no habilita a la Administración a omitir sus propios requisitos"], "a": 3, "j": "Otros principios: legalidad, oficialidad/impulsión de oficio, verdad material, celeridad, gratuidad, control judicial posterior.", "id": 28}, {"t": "proc", "q": "El recurso de nulidad (procesal) procede contra:", "o": ["Todo acto administrativo de alcance particular", "Sentencias dictadas con violación de las solemnidades prescriptas por la ley en forma expresa", "Los defectos de tramitación", "Cualquier resolución definitiva"], "a": 1, "j": "El de queja por defectos de tramitación y plazos se presenta ante el superior jerárquico (art. 71 DR). El recurso contra actos definitivos o que impidan totalmente el reclamo es el de reconsideración/jerárquico.", "id": 29}, {"t": "proc", "q": "Los recursos de reconsideración y de apelación se diferencian en que:", "o": ["La reconsideración la resuelve la Corte", "No hay diferencia", "La apelación la resuelve el mismo juez", "Reconsideración/reposición: lo revisa el mismo órgano; apelación: lo revisa un tribunal superior (doble instancia)"], "a": 3, "j": "El recurso extraordinario federal llega a la Corte por cuestión federal o arbitrariedad; el de queja se usa si el inferior deniega el recurso.", "id": 30}, {"t": "proc", "q": "Las resoluciones generales de ARCA (ej.: RG publicada en el Boletín Oficial):", "o": ["Son obligatorias para todos los contribuyentes y modifican el orden jurídico (reglamentación); las interpretativas esclarecen sin modificar y no son de alcance particular", "Son recomendaciones", "Solo obligan al que las pidió", "No se publican"], "a": 0, "j": "Verdadero/falso de tu examen: 'Una resolución de reglamentación emitida por el Administrador Federal modifica el orden jurídico → V'; 'Las resoluciones interpretativas son de alcance particular → F'; 'La facultad de interpretación tiende a esclarecer el orden jurídico → V'.", "id": 31}, {"t": "ivag", "q": "Una afirmación del examen: 'El IVA es un impuesto directo que no se traslada'. ¿Es correcta?", "o": ["Sí, solo para exportadores", "Sí", "No: es indirecto, plurifásico no acumulativo y neutral; se traslada hasta el consumidor final, que es quien lo soporta", "Sí, solo en la importación"], "a": 2, "j": "Plurifásico: se aplica en cada etapa. No acumulativo: grava solo el mayor valor que adquiere el producto en cada etapa, no el valor total. Neutral: no debe afectar decisiones de producción. Los empresarios recaudan e ingresan, pero no lo soportan.", "id": 32}, {"t": "ivag", "q": "En una cadena productor → mayorista → minorista → consumidor con ventas netas de $1.000, $1.500 y $2.000 (21%), el IVA total ingresado es:", "o": ["$210", "$945", "$420, igual al 21% del precio final", "$315"], "a": 2, "j": "Productor ingresa 210; mayorista 315−210=105; minorista 420−315=105. Suma = 420 = 21% de 2.000. Es la demostración de que cada etapa ingresa solo sobre su valor agregado.", "id": 33}, {"t": "ivag", "q": "De los métodos para medir el valor agregado, ¿cuál se descarta por su complejidad y cuál se aplica?", "o": ["Se aplica adición base contra base", "Se aplica sustracción base contra base", "Se descarta la adición; se aplica sustracción, en la variante 'impuesto contra impuesto'", "Se aplica presunción"], "a": 2, "j": "Adición: sumar mano de obra, gastos y utilidad. Sustracción: restar adquisiciones de ventas; admite 'base contra base' (alícuota sobre la diferencia) o 'impuesto contra impuesto' (DF − CF), el aplicado en Argentina.", "id": 34}, {"t": "ivag", "q": "El criterio de integración financiera significa que:", "o": ["Se computa cuando se usan físicamente", "Se computa al vender", "El crédito fiscal se computa prescindiendo del momento en que las compras se utilizan efectivamente", "Se computa al pagar"], "a": 2, "j": "Integración física: se computa en el período en que se utilizan las compras. En Argentina rige la financiera.", "id": 35}, {"t": "ivag", "q": "Frente a operaciones internacionales el IVA argentino sigue el criterio de:", "o": ["País de destino: no se tributa por lo exportado (tasa cero, con recupero) pero sí por la importación definitiva", "Nacionalidad del contribuyente", "País de origen", "Lugar de firma del contrato"], "a": 0, "j": "Por eso las ventas a Tierra del Fuego se tratan como exportaciones (según tu examen) y la importación transitoria no está gravada.", "id": 36}, {"t": "ivag", "q": "¿El IVA es un impuesto 'instantáneo'?", "o": ["Solo en importaciones", "Sí", "Solo para exportadores", "No: el HI se perfecciona en un momento pero el impuesto se liquida por período (mensual); la visión de Jarach lo ve como anual que agrupa múltiples operaciones"], "a": 3, "j": "La relación jurídico-tributaria nace con el HI y se mantiene hasta que se cancela la obligación. Además el período fiscal es el mes calendario.", "id": 37}, {"t": "ivag", "q": "Para el IVA, ¿existe un importe mínimo a ingresar por mes?", "o": ["No", "Sí, de $1.000", "Sí, para monotributistas", "Sí, para exportadores"], "a": 0, "j": "Verdadero/falso de tu examen ('Para el IVA existe un importe mínimo a ingresar por mes' → FALSO).", "id": 38}, {"t": "ivag", "q": "La determinación del IVA es, por regla:", "o": ["Autodeterminación mediante DDJJ (art. 11 Ley 11.683); la DO es subsidiaria (arts. 16 a 18)", "Liquidación administrativa", "Estimación del Fisco", "Determinación de oficio"], "a": 0, "j": "Las presentaciones de DJ se basan en la autodeterminación, no en la determinación de oficio (otro V/F de tu examen: 'Las presentaciones de DJ se basan en la determinación de oficio' → FALSO).", "id": 39}, {"t": "ivag", "q": "Diferencia entre saldo técnico a favor y saldo de libre disponibilidad:", "o": ["Técnico: CF > DF; solo se compensa con débitos futuros de IVA. Libre disponibilidad: excedente de pagos a cuenta (retenciones, percepciones); puede compensarse con otros impuestos nacionales o pedirse en devolución", "El técnico se devuelve y el de libre disponibilidad no", "Son lo mismo", "El técnico solo se genera por exportaciones"], "a": 0, "j": "Art. 24 de la ley: primer párrafo saldo técnico; segundo párrafo, para bienes de uso (inversiones), el saldo técnico puede imputarse contra otros impuestos nacionales o reintegrarse en ciertos casos. Exportaciones: art. 43.", "id": 40}, {"t": "ivag", "q": "Una empresa agropecuaria, ¿puede optar por pagar el IVA cada 90 días?", "o": ["Sí, siempre", "Sí, solo si exporta", "No; el período fiscal es mensual, con opción anual para la actividad agropecuaria y pago diferido para micro/pequeñas empresas, pero no existe una opción de 90 días", "Sí"], "a": 2, "j": "Verdadero/falso de tu examen: 'En caso de empresa agropecuaria puede optar por abonar el IVA cada 90 días' → FALSO. Art. 27: período fiscal mensual.", "id": 41}, {"t": "ivahi", "q": "Los cuatro aspectos del HI y su pregunta son:", "o": ["Objetivo y cuantitativo", "Material, formal y fiscal", "Objetivo (¿qué?), subjetivo (¿quién?), temporal (¿cuándo?) y espacial (¿dónde?)", "Objetivo (¿cuándo?) y temporal (¿qué?)"], "a": 2, "j": "Espacial: territorialidad/pertenencia económica. Temporal: momento de nacimiento. Subjetivo: sujeto pasivo. Objetivo: hipótesis de incidencia (art. 1).", "id": 42}, {"t": "ivahi", "q": "El aspecto espacial del IVA aplica el principio de:", "o": ["Lugar de firma del contrato", "Domicilio del acreedor", "Territorialidad (fuente) como aplicación de la pertenencia económica: el impuesto se paga donde se genera la riqueza o donde se consume", "Nacionalidad del contribuyente"], "a": 2, "j": "Se grava lo situado en el país, o los servicios prestados/utilizados dentro del país. No importa dónde se firmó el contrato ni la nacionalidad de las partes.", "id": 43}, {"t": "ivahi", "q": "¿Por qué la ley habla de 'cosas muebles' y no de 'bienes'?", "o": ["Cosa (especie) es un objeto material; bien (género) incluye derechos. Se recurre al CCyC (art. 227): quedan fuera, en principio, inmuebles y derechos inmateriales aislados", "Porque solo incluye maquinaria", "Porque incluye inmuebles", "Es un error de la ley"], "a": 0, "j": "Cosas muebles: objetos materiales trasladables, salvo las accesorias a inmuebles.", "id": 44}, {"t": "ivahi", "q": "Venta según el art. 2:", "o": ["Solo la compraventa civil", "Toda transferencia, onerosa o gratuita", "Toda operación entre jurídicas", "Toda transferencia a título oneroso que implique transmisión de dominio de cosas muebles; no exige ánimo de lucro"], "a": 3, "j": "Trampa de tu examen: 'Se considera venta a toda transferencia a título oneroso o GRATUITO...' → FALSO. Se asimilan: permuta, dación en pago, adjudicación por disolución de sociedades, aportes a sociedades, ventas y subastas judiciales, y todo acto oneroso que transmita dominio.", "id": 45}, {"t": "ivahi", "q": "No se consideran venta:", "o": ["Expropiación, reorganización societaria (art. 77 LIG) y transferencias a descendientes/cónyuge entre responsables inscriptos", "Permuta", "Subasta judicial", "Dación en pago"], "a": 0, "j": "Y por la misma razón 'se considera venta a las transferencias en favor de descendientes' es FALSO (trampa de tu examen).", "id": 46}, {"t": "ivahi", "q": "Una cosa mueble de procedencia extranjera se considera situada en el país cuando:", "o": ["Nunca", "Fue importada en forma definitiva", "Solo si se vende", "Fue importada transitoriamente"], "a": 1, "j": "Trampa de tu examen: 'solo cuando hayan sido importadas en forma transitoria' → FALSO. La importación transitoria no está gravada. La definitiva está gravada sin exigir habitualidad.", "id": 47}, {"t": "ivahi", "q": "La dueña de un supermercado retira un pack de gaseosas por su cumpleaños. ¿Cómo se trata?", "o": ["Autoconsumo: se grava (desafectación a uso particular), aplica a empresas unipersonales y no a sociedades regulares", "Exento por ser comestible", "Fuera del objeto", "Exportación"], "a": 0, "j": "Opción correcta del examen: 'se encuentra gravada, deberá abonar el impuesto'. Desafectación de cosas muebles de la actividad gravada con destino a uso o consumo particular de los titulares, aunque no haya transferencia de dominio.", "id": 48}, {"t": "ivahi", "q": "Comisionista que vende en nombre propio bienes de su comitente. ¿Cuántas operaciones considera el IVA y qué se grava?", "o": ["Dos ventas (comitente → comisionista → comprador) y además la comisión como prestación de servicios", "Solo la comisión", "Una sola venta", "Ninguna"], "a": 0, "j": "Ejemplo de la clase: venta 100.000 (+21.000), liquidación al comitente 90.000 (+18.900), comisión 10.000 (+2.100). Comisionista: DF 23.100 − CF 18.900 = 2.100 (IVA de la comisión). Comitente: DF 21.000 − CF 2.100 = 18.900. El intermediario simple no factura la venta principal: solo su comisión está gravada, aunque el bien final sea inmueble o terreno.", "id": 49}, {"t": "ivahi", "q": "'Las comisiones que se obtienen por la intermediación en la venta se encuentran gravadas en IVA'. Verdadero o falso:", "o": ["Solo si vende un inmueble", "Solo si el bien es exento", "Falso", "Verdadero: son prestación de servicios"], "a": 3, "j": "Incluso si la operación final es sobre un inmueble o bien exento/no gravado, la comisión por intermediar puede quedar alcanzada.", "id": 50}, {"t": "ivahi", "q": "La habitualidad en el IVA:", "o": ["Se exige para cada operación", "No importa nunca", "Solo aplica a sociedades", "Se exige para adquirir la calidad de sujeto (art. 4 inc. a), no para cada operación; una vez sujeto, las ventas de bienes afectados a la actividad pueden quedar alcanzadas aunque no sean bienes de cambio"], "a": 3, "j": "Ejemplo: la venta de la computadora del estudio. No se requiere frecuencia determinada. El acto de comercio accidental (comprar para revender con lucro) también puede alcanzarse.", "id": 51}, {"t": "ivahi", "q": "Importación definitiva de cosas muebles:", "o": ["Exenta siempre", "Gravada sin exigir habitualidad; el importador es sujeto del art. 4 inc. c, y su venta posterior solo se grava si encuadra en el inc. a", "Solo si es sociedad", "Requiere habitualidad"], "a": 1, "j": "El art. 1 combina objetivo, espacial y subjetivo: la venta alcanza a sujetos de los incs. a, b, d, e y f (no el c); el importador tributa al importar.", "id": 52}, {"t": "ivahi", "q": "Trabajos sobre inmueble ajeno quedan alcanzados:", "o": ["Solo las reparaciones", "Nunca", "Solo las obras nuevas", "Construcciones, instalaciones con individualidad de cosa mueble, reparaciones y mantenimiento (concepto amplio, art. 3 inc. b)"], "a": 3, "j": "Inmuebles por naturaleza (art. 225 CCyC) y por accesión (art. 226). Las máquinas de una fábrica, aunque estén atornilladas, siguen siendo muebles.", "id": 53}, {"t": "ivahi", "q": "Tríada normativa para obra sobre inmueble propio:", "o": ["Art. 1 + art. 2", "Art. 7 + art. 8", "Art. 28 + art. 43", "Art. 3 inc. b + art. 4 inc. d + art. 5: debe existir empresa constructora con fin de lucro en la ejecución o venta"], "a": 3, "j": "Solo interesa la porción atribuible a la obra. Ejemplos fuera: vender un inmueble en el mismo estado en que se compró; vender la casa construida para vivir. Construir departamentos para vender sí está alcanzado.", "id": 54}, {"t": "ivahi", "q": "Una empresa constructora vende una obra que estuvo alquilada 3 años (continuos o discontinuos) antes de la venta. El IVA:", "o": ["Está exento y no se reintegra nada", "Tributa al 10,5% sobre el total", "Alcanza igual", "No alcanza la venta (DR art. 5: se perdió la búsqueda de lucro), pero debe reintegrarse el crédito fiscal computado (art. 11)"], "a": 3, "j": "Aplica a arrendamiento o derechos reales de usufructo, uso, habitación o anticresis. Si se vende una oficina con CF tomado, puede operar el reintegro del art. 11.", "id": 55}, {"t": "ivahi", "q": "Locación, prestación y obra:", "o": ["Locación es obligación de resultado", "Todas son obligaciones de dar", "Obra es obligación de no hacer", "Locación: cesión onerosa de uso o goce; prestación: obligación de hacer (no de resultado); obra: obligación de resultado; concesión: otorgamiento de una explotación o derecho económico"], "a": 3, "j": "Si son onerosas y sin relación de dependencia quedan gravadas (generalización art. 3 inc. e ap. 21). Las obligaciones de no hacer y cesiones de derechos no están gravadas, salvo servicio financiero o concesión de explotación.", "id": 56}, {"t": "ivahi", "q": "Obras, prestaciones y locaciones realizadas en el país cuya utilización o explotación efectiva se lleva a cabo en el exterior son:", "o": ["Exportación de servicios (no gravadas, con recupero art. 43)", "Importación de servicios", "Gravadas al 10,5%", "Gravadas al 21%"], "a": 0, "j": "Prestación en el país gravada, EXCEPTO utilización efectiva en el exterior.", "id": 57}, {"t": "ivahi", "q": "Importación de servicios (art. 1 inc. d): ¿cuándo se grava?", "o": ["Servicio prestado desde el exterior, con utilización o explotación efectiva en el país, y prestatario local sujeto del IVA por otros hechos imponibles; el impuesto se ingresa con reglas especiales y luego puede computarse como crédito", "Siempre que el prestador sea extranjero", "Solo si se firma en Argentina", "Solo para consumidores finales"], "a": 0, "j": "La clave es dónde se usa o explota. Los servicios digitales (art. 1 inc. e y 3 inc. e ap. 21 m) alcanzan también a consumidores finales; la intermediación de tarjetas y plataformas puede operar como percepción.", "id": 58}, {"t": "ivahi", "q": "Dividendos pagados en acciones por una sociedad:", "o": ["Tributan 21%", "Tributan 10,5%", "No tributan IVA; además la cesión de acciones y títulos valores está excluida (art. 3 inc. e ap. 21 i)", "Tributan 27%"], "a": 2, "j": "Los CEDEARs tampoco están alcanzados en IVA; en Bienes Personales se consideran bienes del exterior.", "id": 59}, {"t": "ivahi", "q": "Una entidad religiosa exenta alquila un inmueble propio a una persona humana para brindar clases de religión y esta pide factura. La entidad dice que no está obligada a emitir factura. Es:", "o": ["Verdadero según la respuesta de tu examen: al ser sujeto exento no genera débito, y el locatario no puede computar crédito", "Falso: debe emitir factura B", "Falso: debe emitir factura A", "Falso: debe emitir factura E"], "a": 0, "j": "Los sujetos exentos no discriminan IVA. Este punto vale para tu examen tal como figura en tu material.", "id": 60}, {"t": "ivanac", "q": "¿Qué criterio sigue el IVA para el nacimiento del HI?", "o": ["El cobro siempre", "El que fija la ley (arts. 5 y 6), no el contable; además debe existir efectivamente el bien y haber sido puesto a disposición", "El devengado contable", "El inicio del contrato"], "a": 1, "j": "No basta con que exista la operación: hay que determinar el momento imponible.", "id": 61}, {"t": "ivanac", "q": "Venta de cosas muebles: el HI nace cuando ocurra primero:", "o": ["La firma del contrato", "El cierre del mes", "La entrega del bien o la facturación (o acto equivalente)", "El cobro"], "a": 2, "j": "Entrega: tradición real o simbólica, puesta a disposición, remito, boleto, transferencia de posesión.", "id": 62}, {"t": "ivanac", "q": "Entrega el 25/03, factura el 03/04 y cobra el 30/05. ¿En qué mes se genera el débito fiscal?", "o": ["A opción del contribuyente", "Marzo", "Abril", "Mayo"], "a": 1, "j": "Ocurre primero la entrega. Ejercicio literal de tu examen.", "id": 63}, {"t": "ivanac", "q": "Anticipo o seña: ¿cuándo perfecciona el HI?", "o": ["Nunca", "Siempre", "Solo si supera el 50%", "Cuando congela el precio o equivale al pago total; la seña que no fija precio no lo perfecciona (fallo 'Equipos S.A.')"], "a": 3, "j": "Cuando congela el precio, la seña deja de ser reserva y pasa a ser contraprestación definitiva: el HI nace al percibirla aunque la entrega o la factura sean posteriores.", "id": 64}, {"t": "ivanac", "q": "Precio 100 y se cobran 30 por anticipo que congela el precio. IVA nace sobre:", "o": ["70", "30, es decir la parte percibida", "0", "100"], "a": 1, "j": "Percepción parcial: el HI nace por esa parte.", "id": 65}, {"t": "ivanac", "q": "Prestación de servicios: el HI nace cuando ocurra primero:", "o": ["La emisión de factura únicamente", "La terminación del servicio o la percepción total o parcial del precio", "El vencimiento de la DDJJ", "El inicio del servicio"], "a": 1, "j": "Incluye locaciones, servicios profesionales, concesiones, mantenimiento y servicios públicos.", "id": 66}, {"t": "ivanac", "q": "Honorarios de abogado regulados judicialmente en diciembre 2022 y cobrados totalmente en marzo 2023:", "o": ["HI y factura en marzo 2023 (percepción o emisión de factura, lo anterior)", "Diciembre 2022", "Cierre del ejercicio 2022", "Enero 2023"], "a": 0, "j": "Regla especial para honorarios judiciales o a través de cajas forenses, colegios o consejos profesionales.", "id": 67}, {"t": "ivanac", "q": "Teléfono y servicios de telecomunicaciones regulados por tarifas: ¿cuándo nace el HI?", "o": ["Al firmar el contrato", "Con el vencimiento del plazo para el pago o la percepción total/parcial, lo anterior", "Al emitir la factura únicamente", "Al terminar el mes"], "a": 1, "j": "Para agua, cloacas y servicios con medidor a consumidor final con destino vivienda: percepción total o parcial del precio.", "id": 68}, {"t": "ivanac", "q": "Servicios continuos sin fecha de finalización (ej.: consultoría):", "o": ["Al final del contrato", "El HI se perfecciona con la finalización de cada mes calendario (período base de facturación mensual)", "Al cobrar el último pago", "A fin de año"], "a": 1, "j": "Se entiende que hay cortes mensuales.", "id": 69}, {"t": "ivanac", "q": "Locación de inmuebles:", "o": ["Al entregar las llaves", "Al vencer el contrato", "El HI nace con el vencimiento del plazo fijado para el pago o la percepción total o parcial, lo anterior", "Al firmar el contrato"], "a": 2, "j": "Locación de cosas y circuitos de telecomunicaciones: al devengarse el pago o percibirse, lo anterior.", "id": 70}, {"t": "ivanac", "q": "Trabajos sobre inmueble ajeno:", "o": ["Al firmar el contrato", "Al escriturar", "Aceptación del certificado de obra, percepción total/parcial o facturación, lo que ocurra primero", "Al finalizar la obra"], "a": 2, "j": "Regla del servicio. En obras sobre inmueble PROPIO: transferencia a título oneroso (posesión o escritura, lo anterior).", "id": 71}, {"t": "ivanac", "q": "Productos primarios con precio a fijar posteriormente: ¿cuándo nace el HI y qué discutían el Dictamen DAT 164/94 y 'Yerbatera Andresito'?", "o": ["Siempre al entregar", "Nace al determinarse el precio. DAT 164/94: solo si hay imposibilidad objetiva de fijarlo al entregar; 'Yerbatera Andresito': basta que sea producto primario y el contrato prevea fijarlo después, aun por conveniencia de las partes", "Nunca nace", "Siempre al facturar"], "a": 1, "j": "La discusión es si hace falta una razón objetiva (calidad, humedad, tenor graso) para diferir el precio. La pizarra conocida al momento de entrega es el punto de conflicto.", "id": 72}, {"t": "ivanac", "q": "Se entrega y deja funcionando una máquina en marzo; precio mínimo $50.000.000 y en abril se pagan $5.000.000 más si supera cierta capacidad. ¿Cuándo nace el HI y qué pasa con el adicional?", "o": ["A opción de las partes", "Solo al cobrar el adicional", "En abril por todo", "En marzo con la entrega; en abril se emite nota de débito por $5.000.000 más IVA ($1.050.000 al 21%)"], "a": 3, "j": "La falta de precio definitivo no impide el nacimiento del HI si la mercadería ya fue entregada. Si no se pactó precio, puede determinarse por similares del mercado.", "id": 73}, {"t": "ivanac", "q": "En el canje de productos primarios por bienes o servicios recibidos antes de la entrega de aquellos:", "o": ["Nace al terminar el ejercicio", "Nace al cobrar", "El HI nace para ambas partes al momento de la entrega, y el precio neto computable de cada parte es el valor de plaza (art. 10 4° párr.)", "No hay HI"], "a": 2, "j": "El problema práctico es determinar el valor de plaza vigente.", "id": 74}, {"t": "ivanac", "q": "Seguros:", "o": ["El HI nace al emitirse la póliza o suscribirse el contrato; en seguros de riesgos especiales (caución, flotantes, granizo) cuando no puede liquidarse al emitir, nace al conocerse o determinarse", "Al siniestro", "Al pagar la última cuota", "Al finalizar la vigencia"], "a": 0, "j": "DR art. 5, 21.2.", "id": 75}, {"t": "ivanac", "q": "Intereses: ¿cuándo nace el HI?", "o": ["Siempre al devengarse contablemente", "Nunca", "Con el vencimiento del plazo fijado para el pago del rendimiento o la percepción total/parcial, lo anterior; los intereses por pagos diferidos facturados discriminados siguen esa regla, los no discriminados siguen el HI de la operación principal", "Al cierre del ejercicio"], "a": 2, "j": "Casos especiales: pagos fuera de término (con la percepción, art. 24 DR), mora del Estado (art. 22 DR), operaciones exentas o no alcanzadas, obras sobre inmueble propio.", "id": 76}, {"t": "ivanac", "q": "Contratos a ensayo o prueba:", "o": ["Con el pago", "Con la aceptación definitiva", "Con la factura únicamente", "El HI se perfecciona con la entrega provisional de los bienes (DR 19)"], "a": 3, "j": "Y los bienes de propia producción incorporados a prestaciones exentas o no gravadas: con la entrega del bien (incorporación).", "id": 77}, {"t": "ivaex", "q": "Diferencia entre exento y no gravado:", "o": ["Exento genera DF", "Exento: hay HI pero la ley libera; no genera DF y, en principio, tampoco CF. No gravado/excluido: no hay HI, no hay obligación ni DF ni CF", "No gravado genera CF", "Son lo mismo"], "a": 1, "j": "Ejemplos: enseñanza oficial reconocida (exento); venta de inmueble usado por persona humana no constructora (no gravado); servicios profesionales (gravado 21%); panificados (10,5%); exportación (art. 43, con recupero).", "id": 78}, {"t": "ivaex", "q": "Criterio de interpretación de las exenciones:", "o": ["Se interpretan siempre ampliamente", "La imposición es la regla y la exención la excepción, expresada en términos claros; el TFN pide una interpretación razonada y no restrictiva al máximo; la analogía está prohibida", "Pueden crearse por analogía", "Pueden crearse por resolución general"], "a": 1, "j": "La LPF prohíbe la interpretación analógica.", "id": 79}, {"t": "ivaex", "q": "¿Qué exenciones objetivas enumera el art. 7 (incs. a a g)?", "o": ["Libros y similares (salvo editorial), sellos y timbres sin obliterar, billetes de juegos y espectáculos, oro amonedado 999/1000, monedas metálicas, agua ordinaria natural, leche y medicamentos de uso humano (condicionados), aeronaves y embarcaciones", "Servicios profesionales", "Alquileres comerciales", "Ropa"], "a": 0, "j": "El libro exento no alcanza a la venta efectuada por sujetos de la actividad editorial. La leche es la pasteurizada homogeneizada para consumo humano (Código Alimentario); el pan común estuvo exento hasta 2006, luego 10,5%. Medicamentos: exención 'mixta o condicionada' según el apunte; verificá la condición en la ley.", "id": 80}, {"t": "ivaex", "q": "Tipos de exenciones:", "o": ["Solo objetivas", "Directas e indirectas", "Solo subjetivas", "Objetivas (a bienes), subjetivas (a sujetos, art. 7.1) y mixtas o condicionadas (ej.: leche, medicamentos, locación para casa habitación)"], "a": 3, "j": "Subjetiva: asociaciones civiles sin fines de lucro con personería jurídica dedicadas a educación, asistencia social y salud pública (Ley 16.656).", "id": 81}, {"t": "ivaex", "q": "Soporte material de un servicio (ej.: anteojos, placa radiográfica) no es venta si:", "o": ["Siempre", "Prestación y entrega se perfeccionan juntas, existe vinculación natural, funcional, técnica o jurídica, y la cosa es solo el soporte de la obligación", "Nunca", "Si cuesta menos que el servicio"], "a": 1, "j": "Art. 6 DR y art. 3 inc. c. Es una exclusión de objeto.", "id": 82}, {"t": "ivaex", "q": "Refrigerios y comidas en lugares de trabajo, establecimientos sanitarios exentos o de enseñanza reconocidos, exclusivos para personal, pacientes, acompañantes y alumnos:", "o": ["Exentos del art. 7", "Gravados al 21%", "Quedan excluidos del objeto (art. 3 inc. e ap. 1)", "Gravados al 27%"], "a": 2, "j": "La clave es la exclusividad (Dictámenes 71/2001 y 81/2005 a favor del Fisco; 'Bandeira SA' a favor del contribuyente; 'Prodecom SA').", "id": 83}, {"t": "ivaex", "q": "Estacionamiento: ¿qué queda fuera del objeto?", "o": ["Ninguno", "Todo estacionamiento", "El estacionamiento en la vía pública cuando es explotado por el Estado o por entidades del art. 20 LIG (asociaciones, fundaciones, mutuales, deportivas)", "Los garajes privados"], "a": 2, "j": "Playas y garajes están gravados (art. 3 inc. e ap. 16). Dictamen 42/1994: estacionamiento de la UBA gravado por no ser en vía pública.", "id": 84}, {"t": "ivaex", "q": "Servicios prestados por el Estado y entidades (art. 7 h) 1): ¿quién está exento y cuándo?", "o": ["Ambos", "El PRESTADOR estatal con diferenciación patrimonial y funciones de policía, regulación, educación, asistencia social, salud pública o investigación; no quien le presta servicios al Estado", "Quien le presta servicios al Estado", "Ninguno"], "a": 1, "j": "Decreto 145/1981. Si su objeto principal es empresarial (comercial/industrial), no hay exención.", "id": 85}, {"t": "ivaex", "q": "Enseñanza privada con planes oficiales (incluye guarderías y jardines maternoinfantiles) está:", "o": ["No alcanzada", "Gravada 10,5%", "Exenta, incluso clases a título particular con contenido de plan oficial y alojamiento/transporte accesorios", "Gravada 21%"], "a": 2, "j": "Jurisprudencia: carreras de inglés con título Cambridge ('Alba A. e Ivernizzi', CSJN 2006); capacitación laboral con certificados ('Educación Sur SA', TFN 2008).", "id": 86}, {"t": "ivaex", "q": "Asistencia sanitaria, médica y paramédica (art. 7 h) 7): ¿cuándo está exenta?", "o": ["Si el paciente paga en efectivo", "Siempre", "Si es privado", "Cuando se factura a obras sociales, colegios y consejos profesionales (beneficiarios directos o grupo familiar); cooperativas, mutuales y prepagas solo si reciben derivaciones de obra social"], "a": 3, "j": "Incluye hospitalización, insumos y todas las especialidades. Se excluyen pre ocupacionales y control de ausentismo. Dictamen 5/2005: honorarios como director técnico gravados.", "id": 87}, {"t": "ivaex", "q": "Transporte de pasajeros:", "o": ["Exentos taxímetros y remises con chofer hasta 100 km; los demás servicios de transporte de pasajeros en el país al 10,5%; internacional: art. 43; transporte de cargas interno: gravado", "Todo gravado 27%", "Todo gravado 21%", "Todo exento"], "a": 0, "j": "Dictamen 28/2001: venta de unidades usadas de taxi no gravada.", "id": 88}, {"t": "ivaex", "q": "Locación de inmuebles destinados a casa habitación está exenta cuando:", "o": ["Siempre", "Solo para jurídicas", "No supera el tope de RG 1032 ($1.500 por unidad y locatario) o cuando el locatario es el Estado (con excepciones)", "Nunca"], "a": 2, "j": "Art. 7 h) 22 y art. 3 inc. 18; DR 38/49.1. El excedente tributa 21%.", "id": 89}, {"t": "ivaex", "q": "Prestaciones complementarias a una exenta:", "o": ["Siempre quedan gravadas", "Siempre exentas", "Depende de lo que decida el contribuyente", "Quedan exentas si hay vinculación natural, funcional, técnica o jurídica (fallo 'Boedo Sur': teatro exento más restaurante → pierde el contribuyente porque la comida no era complementaria)"], "a": 3, "j": "Última parte del art. 7: bienes o servicios gravados prestados en forma complementaria con exentos. Verdadero/falso de tu examen: 'las prestaciones complementarias y accesorias a la exenta se encuentran exentas por ser necesarias para reproducir o transportar el contenido principal → V'.", "id": 90}, {"t": "ivaex", "q": "Otros sujetos exentos del art. 7:", "o": ["Todos los monotributistas", "Obras sociales; entidades del art. 20 LIG incs. e (religiosas), f (asociaciones/fundaciones de asistencia social, salud, educación, etc.), g (mutuales) y m (deportivas); instituciones políticas; colegios y consejos profesionales por sus fines", "Todas las cooperativas", "Todas las sociedades comerciales"], "a": 1, "j": "Las exenciones del inc. f no alcanzan a quienes hagan actividad comercial o industrial ni a quienes obtengan recursos de espectáculos públicos, juegos de azar o carreras de caballos.", "id": 91}, {"t": "ivaex", "q": "Importaciones del art. 8 exentas:", "o": ["Ninguna", "Solo las de bienes de capital", "Importaciones definitivas con franquicias (equipaje, diplomáticos, científicas), para entidades religiosas o exentas, muestras, encomiendas, donaciones al Estado; y las exportaciones (art. 43)", "Todas"], "a": 2, "j": "El exportador recupera el CF vinculado (compensación o devolución).", "id": 92}, {"t": "ivaex", "q": "Los remedios, ¿están exentos 'independientemente de quien los consuma, siempre que hayan tributado IVA en la etapa anterior'?", "o": ["Solo en farmacias", "No: es una exención condicionada, no incondicional (V/F de tu examen: FALSO)", "Solo para obra social", "Sí"], "a": 1, "j": "Medicamentos para uso humano: exención mixta o condicionada. En el recuperatorio de tu material figura una respuesta del 10,5% con condiciones (listado ANMAT y troquel); revisá cuál sostuvo tu cátedra.", "id": 93}, {"t": "ivadf", "q": "Alícuotas del IVA:", "o": ["21% general, 10,5% reducida (ej. panificados, obras sobre inmuebles destinados a vivienda, transporte de pasajeros no exento, ciertos productos) y 27% incrementada (servicios públicos a responsables inscriptos, salvo uso vivienda)", "10,5% general y 21% incrementada", "21%, 5% y 35%", "Solo 21%"], "a": 0, "j": "Según el examen del material: consultá en el art. 28 el listado vigente de bienes a 10,5% (ej.: carnes, hortalizas, arroz) y 27% (gas, energía, agua, telecomunicaciones a RI no domésticos).", "id": 94}, {"t": "ivadf", "q": "Una empresa vende por $121.000 IVA incluido (21%). El débito fiscal es:", "o": ["$24.200", "$12.100", "$21.000", "$25.410"], "a": 2, "j": "Neto = 121.000 / 1,21 = 100.000 → DF = 21.000.", "id": 95}, {"t": "ivadf", "q": "Compró $50.000 netos y vendió $80.000 netos (21%). IVA a pagar:", "o": ["$6.300", "$16.800", "$10.500", "$21.000"], "a": 0, "j": "DF 16.800 − CF 10.500.", "id": 96}, {"t": "ivadf", "q": "El débito fiscal se reduce por devoluciones, rescisiones, descuentos, bonificaciones y quitas del período, aplicando:", "o": ["Solo sobre el neto", "La alícuota a la que en su momento estuvieron sujetas las operaciones; opera la presunción absoluta de que descuentos y quitas son proporcionales entre neto e impuesto facturado", "Cero", "Una alícuota fija"], "a": 1, "j": "Condiciones del art. 12 inc. b: costumbres de plaza, que se facturen y que se contabilicen. Ejemplo de la clase: NC por 27,10 sobre una factura con parte gravada y parte exenta → DF 2,10.", "id": 97}, {"t": "ivadf", "q": "Se vendieron 10 unidades a $100.000 netos (IVA $21.000) y se devuelven 2 unidades. ¿Cuánto es la nota de crédito?", "o": ["Solo se devuelve el neto", "No procede", "Se aplica la presunción proporcional sobre el total", "Neto $20.000 + IVA $4.200: imputación directa de las unidades devueltas"], "a": 3, "j": "Con imputación directa no se aplica la presunción. En cambio, una bonificación general por volumen o quita sobre saldo sí se considera proporcional neto/IVA (DR 50).", "id": 98}, {"t": "ivadf", "q": "Desafectación de obras que generaron CF antes de 10 años desde la finalización o afectación:", "o": ["No genera nada", "Genera CF adicional", "Se pierde el derecho a todo CF", "Genera débito fiscal por el CF oportunamente computado"], "a": 3, "j": "Aplica a transferencia o desafectación de la actividad gravada (vender o afectar a actividad exenta) dentro de los 10 años. Es consecuencia de que no hay crédito sin débito.", "id": 99}, {"t": "ivadf", "q": "El crédito fiscal (art. 12) se computa con un tope:", "o": ["El 50% siempre", "Montos netos de compras, locaciones y prestaciones por la alícuota correcta (facturado/surja de base×tasa), en la medida en que se vinculen con operaciones gravadas", "El total sin comprobante", "El IVA facturado sin límite"], "a": 1, "j": "Procede cuando se perfeccionó el HI para la contraparte (excepción importación de servicios) y en el período inmediato siguiente; el cómputo diferido no perjudica al Fisco (Dictamen 32/96).", "id": 100}, {"t": "ivadf", "q": "Presunciones de no vinculación con actividad gravada (CF no computable), salvo excepciones:", "o": ["Ninguna", "Solo maquinaria", "Todas las compras", "Automóviles con precio neto superior a $20.000 (salvo bienes de cambio o actividad principal: alquiler, taxis, remises, viajantes); gastronomía, hotelería, alojamiento transitorio, masajes, gimnasios, peluquerías, playas de estacionamiento; indumentaria que no sea ropa de trabajo exclusiva"], "a": 3, "j": "DR 52 excepciones: cuando locatario o prestatario es locador/prestador de los mismos servicios; conferencias, congresos y convenciones relacionadas con la actividad; indumentaria que sea bien de cambio o de uso exclusivo en el trabajo (guardapolvos, guantes, botas).", "id": 101}, {"t": "ivadf", "q": "Un RI no puede computar el CF de una compra. ¿Con qué comprobante debe recibir el tratamiento?", "o": ["Factura A siempre", "Factura E", "Factura C", "Factura B (de consumidor final), según Nota Externa 84/2014; si se emite A por excepción, debe consignarse el motivo (desde RG 4520 en los campos 'Adicionales por RG', ya no se presenta el F.8001)"], "a": 3, "j": "El RI que no puede computar CF recibe el tratamiento del consumidor final.", "id": 102}, {"t": "ivadf", "q": "Deudores incobrables: ¿se puede computar el CF de la operación o emitir una nota de crédito?", "o": ["Sí, tras 1 año", "Solo si el deudor quiebra", "No, ninguna de las dos cosas (fallo 'Atelco SA', TFN sala A, 2005)", "Sí, siempre"], "a": 2, "j": "No encuadra en los conceptos del art. 12 inc. b (descuentos, bonificaciones, quitas, devoluciones o rescisiones). El fallo 'Celulosa Campana' (CSJN 2015) trató las quitas concursales.", "id": 103}, {"t": "ivadf", "q": "Un RI dona o entrega a título gratuito bienes gravados de su actividad. ¿Qué pasa con el CF?", "o": ["Debe pagar el doble", "Nada", "Puede computar más CF", "Debe reintegrar el CF computado en el período en que ocurre (art. 58 DR); no si son muestras gratis; en bienes de uso solo la parte no amortizada"], "a": 3, "j": "Se refiere a desprendimientos incidentales y definitivos, no resarcidos por la actividad gravada. Bienes de uso totalmente amortizados: sin reintegro.", "id": 104}, {"t": "ivadf", "q": "Locatario de un inmueble donde desarrolla actividad gravada (art. 57 DR):", "o": ["Computa solo el 50%", "No puede computar nada", "Solo computa si la factura es a su nombre", "Puede computar CF de agua, gas, luz, teléfono, internet y expensas facturados a nombre del propietario si el contrato (o una nota firmada) pone esos servicios a su cargo"], "a": 3, "j": "Excepción al requisito formal de la factura a nombre propio.", "id": 105}, {"t": "ivadf", "q": "Prorrateo (art. 13): ¿cuándo procede y cuándo no?", "o": ["Siempre", "Procede cuando las compras se destinan indistintamente a operaciones gravadas y exentas/no gravadas y no puede apropiarse a unas u otras; no procede si hay incorporación física o directa o puede conocerse la proporción (art. 55 DR)", "Solo en la importación", "Nunca"], "a": 1, "j": "Se estima durante el ejercicio y se ajusta anualmente con Ventas gravadas / Ventas totales en montos netos (DR 53).", "id": 106}, {"t": "ivadf", "q": "Ventas netas gravadas $800.000 y exentas $200.000. Compras comunes con CF de $100.000. CF computable:", "o": ["$80.000", "$20.000", "$100.000", "$50.000"], "a": 0, "j": "Proporción 80% de ventas gravadas. Sin prorrateo se computaría todo; el 20% queda sin computar.", "id": 107}, {"t": "ivadf", "q": "Ajuste anual de prorrateo: ventas netas gravadas $1.260.000 y exentas $140.000; se computó de enero a noviembre 80% sobre compras con IVA de $14.700 (70.000 × 21%). ¿Cuánto falta computar?", "o": ["$1.470 (corresponde 90% = 13.230, ya computado 11.760)", "$0", "$11.760", "$13.230"], "a": 0, "j": "Ejemplo de la clase: 70.000×0,21×0,80=11.760 computado; 70.000×0,21×0,90=13.230 que corresponde; diferencia 1.470 a computar.", "id": 108}, {"t": "ivadf", "q": "Cambios en la gravabilidad (arts. 15 a 17): si se eliminan exenciones o se crean nuevos hechos gravados:", "o": ["Se reintegra todo", "No se puede computar el impuesto facturado por hechos anteriores al cambio; si se dispone una exención nueva, no se reintegra el CF ya computado sobre bienes en existencia", "No hay efectos", "Se computa todo el CF anterior"], "a": 1, "j": "Art. 15 y 16: no computable; art. 17: no deben reintegrar el impuesto computado por bienes en existencia.", "id": 109}, {"t": "ivadf", "q": "Art. 18: habitualista en compraventa de bienes usados a consumidores finales. ¿Qué CF puede computar?", "o": ["El 100% del precio", "Ninguno", "CF ficto = precio de compra × alícuota/(100+alícuota), con comprobante de compra de bienes usados firmado por el consumidor final, con tope de precio neto de venta × 90% × alícuota; el excedente integra el DF del mes de venta", "El IVA facturado por el consumidor"], "a": 2, "j": "Ejemplo: Redcars compra un aire usado a $1.210 (CF 210) y vende a $1.300; tope 1.300×90%×21% = 245,70, no hay ajuste. Si vendiera a $800, tope 151,20: debe ajustar 58,80 en noviembre. No aplica a compras a monotributistas (art. 28 DR Monotributo).", "id": 110}, {"t": "ivadf", "q": "'Para la compraventa de ropa usada no se puede tomar el CF generado aunque quien compre sea RI porque quien vende es consumidor final'. V o F:", "o": ["Verdadero solo en ropa", "Falso: se puede computar el CF ficto del art. 18", "Verdadero", "Verdadero solo si vende en feria"], "a": 1, "j": "Verdadero/falso de tu examen resuelto como FALSO.", "id": 111}, {"t": "ivadf", "q": "Art. 20 Comisionistas y consignatarios: el que vende en nombre propio bienes de terceros considera:", "o": ["Cero", "Valor de venta: el facturado al comprador; CF = alícuota × valor neto liquidado al comitente. El que compra en nombre propio para terceros es vendedor del bien frente a su comitente", "El valor de costo", "Solo el valor de la comisión"], "a": 1, "j": "Ejemplo vendiendo por cuenta de Pedro: DF 21.000, CF 18.900, posición neta 2.100. Comprando por cuenta de Pedro: DF 23.100 (110.000 × 21%), CF 21.000, posición neta 2.100.", "id": 112}, {"t": "ivadf", "q": "Art. 21 Intermediarios por cuenta y orden de terceros (mandatarios): base imponible:", "o": ["Comisión + gastos a nombre propio reembolsables vinculados a operaciones gravadas; el resto de gastos se factura por separado", "Cero", "Solo la comisión", "El total de la operación"], "a": 0, "j": "Computa CF de las facturas de esos gastos y el mandante computa el CF de la factura del intermediario.", "id": 113}, {"t": "ivadf", "q": "Mercado de cereales a término (art. 19): base imponible y efecto para el mercado:", "o": ["Costo", "Precio de venta", "Valor FOB", "Precio de ajuste; para el mercado la operación es neutra (DF = CF)"], "a": 3, "j": "Ejemplo: precio pactado 500.000 y de ajuste 545.000 → al 10,5% DF 57.225 y CF 57.225, saldo 0.", "id": 114}, {"t": "ivadf", "q": "Servicios de turismo (art. 22): base imponible:", "o": ["Siempre cero", "Precio neto menos costo neto de bienes y servicios prestados en el exterior y pasaje al extranjero, discriminados globalmente como 'no computables'; si no se discrimina, se grava el total", "Solo la comisión", "Siempre el total"], "a": 1, "j": "Concesiones (art. 23): BI = ingresos del concesionario; el HI nace con cada percepción.", "id": 115}, {"t": "ivadf", "q": "Art. 21 Ley 27.541: ¿qué crédito fiscal permite?", "o": ["Un CF sobre sueldos pagados en efectivo", "Ninguno", "Un porcentaje (según la jurisdicción) sobre las remuneraciones brutas computables para contribuciones patronales efectivamente abonadas, en la DDJJ de IVA del mismo período si se pagan hasta su vencimiento (Entre Ríos: 3%)", "Un CF fijo"], "a": 2, "j": "Si el pago se efectúa después del vencimiento del IVA, se computa en el período en que se abonaron. Referencias: CABA 1,30%, Santa Fe y Córdoba 2,55%, Mendoza 3%, Tierra del Fuego 8,85%.", "id": 116}, {"t": "ivadf", "q": "Pasaje del monotributo al régimen general (ingresos de los 12 meses anteriores ≤ 50% del límite microempresas): ¿qué beneficio hay en IVA?", "o": ["Devolución en efectivo", "Sumar al CF del período el impuesto facturado en los 12 meses anteriores al efecto de la renuncia o exclusión, si las compras se relacionan con la actividad; además reducción del saldo deudor 50%, 30% y 10% en 3 años para quienes comunicaron voluntariamente la renuncia o exclusión", "Ninguno", "Exención total por 5 años"], "a": 1, "j": "En Ganancias pueden deducir las compras de los 12 meses anteriores netas de IVA.", "id": 117}, {"t": "ivadf", "q": "Ley de Transparencia Fiscal al Consumidor:", "o": ["Elimina la factura B", "Crea un nuevo impuesto", "Obliga a informar al consumidor el IVA y otros impuestos incluidos en el precio final", "Prohíbe el IVA"], "a": 2, "j": "En las facturas B se informa la carga impositiva; la suma de lo ingresado por todas las etapas coincide con lo que paga el consumidor final.", "id": 118}, {"t": "ivaesp", "q": "Una empresa tiene DF $12.000, CF $9.000 y retenciones sufridas $1.500. IVA a ingresar:", "o": ["$1.500", "$10.500", "$3.000", "$22.500"], "a": 0, "j": "Saldo técnico a pagar = 3.000; las retenciones son pagos a cuenta: 3.000 − 1.500 = 1.500. Si las retenciones excedieran el saldo, el remanente sería de libre disponibilidad.", "id": 119}, {"t": "ivaesp", "q": "Factura A, B y C:", "o": ["A: RI a RI discriminando IVA (da CF); B: a consumidor final/exentos sin discriminar; C: monotributista (no da CF). Factura E: exportación; T: turistas", "B discrimina IVA", "C la emite un RI", "Todas dan CF"], "a": 0, "j": "Un monotributista que factura a un RI no genera CF.", "id": 120}, {"t": "ivaesp", "q": "Quién debe ingresar el impuesto en importación de servicios:", "o": ["El Estado", "El prestador extranjero siempre", "El banco", "El prestatario local, sujeto del IVA, que luego puede computarlo como crédito fiscal"], "a": 3, "j": "En servicios digitales a consumidores finales opera percepción por plataformas o medios de pago.", "id": 121}, {"t": "ivaesp", "q": "Consigna típica de examen: un RI recibe una factura A con IVA de bienes que usa en su actividad gravada. ¿Qué debe verificar para computar el CF?", "o": ["Que el proveedor sea grande", "Solo el monto", "Solo que exista la factura", "Que se vincule con operaciones gravadas, que el HI se haya perfeccionado para la contraparte, que no caiga en las presunciones de no vinculación y que el comprobante sea válido"], "a": 3, "j": "Método de análisis: 1) ¿hay HI? (arts. 1 y 3) 2) ¿quién es sujeto? (art. 4) 3) ¿exención o tasa especial? (arts. 7, 28 o 43) 4) ¿qué pasa con el CF? (arts. 12 y 13).", "id": 122}, {"t": "pf", "q": "¿Por qué la determinación de oficio es un procedimiento 'subsidiario'?", "o": ["Porque la hace un órgano subordinado al Tribunal Fiscal", "Porque la regla es la autodeterminación del contribuyente mediante DDJJ, y ARCA solo interviene ante incumplimiento total o parcial", "Porque solo procede después de una sentencia judicial", "Porque reemplaza al pago voluntario cuando el contribuyente lo prefiere"], "a": 1, "j": "El sistema se basa en que el contribuyente liquida e ingresa por sí mismo (DDJJ, arts. 11, 109 y 110). La determinación de oficio solo opera si no presentó la DDJJ o esta es impugnable. Dentro de la propia DO, además, la base presunta es subsidiaria de la base cierta: por eso se dice que es 'subsidiaria de lo subsidiario'.", "id": 123}, {"t": "pf", "q": "La determinación tributaria, ¿es un acto constitutivo o declarativo de la obligación?", "o": ["Declarativo: la obligación nace con el hecho imponible realizado por el contribuyente y la DO solo la declara y cuantifica", "Constitutivo para impuestos y declarativo para multas", "Constitutivo: la obligación nace recién con la DO", "Ninguno: es un acto preparatorio sin efectos"], "a": 0, "j": "El acto que 'constituye' es el hecho imponible. La DO declara que ese HI ya se realizó conforme a la ley, determina quién debe y cuánto (Villegas). Por eso el HI tiene que ser preexistente: sin HI no hay impuesto a determinar.", "id": 124}, {"t": "pf", "q": "Una declaración jurada de IVA tiene dos partes. Si ARCA discrepa con la base imponible y el impuesto determinado, y también con un saldo a favor y retenciones computados, ¿qué procede?", "o": ["Determinación de oficio para ambos", "Intimación para ambos", "Ejecución fiscal directa para ambos", "Determinación de oficio para lo primero; simple intimación de pago (art. 14) para lo segundo"], "a": 3, "j": "Los elementos que componen la DDJJ (base imponible + impuesto) se impugnan por DO. Los conceptos que liberan del pago (pagos a cuenta, retenciones, saldos a favor, beneficios) se verifican y, si son improcedentes, basta la intimación (art. 14). Por eso la DO 'llega hasta donde se calcula el impuesto'.", "id": 125}, {"t": "pf", "q": "El contribuyente, en una verificación, acepta por escrito la liquidación administrativa y presenta la DDJJ rectificativa, pero no paga. ¿Cómo procede ARCA?", "o": ["Solo puede iniciar sumario por defraudación", "Debe correr vista y dictar determinación de oficio", "Debe esperar la prescripción", "Intima el pago directamente, sin determinación de oficio (art. 17, penúltimo párrafo)"], "a": 3, "j": "No hay disconformidad que resolver: el contribuyente ya conformó. Tampoco procede DO cuando la disconformidad se limita a errores de cálculo, cuando agentes de retención/percepción presentaron DDJJ sin ingresar lo retenido, ni ante beneficios promocionales caducos. En todos esos casos 'basta la mera intimación'.", "id": 126}, {"t": "pf", "q": "¿Qué diferencia hay entre una liquidación administrativa y una resolución de determinación de oficio?", "o": ["La liquidación es definitiva y la DO preparatoria", "La liquidación la dicta el Tribunal Fiscal", "La liquidación es un acto preparatorio no impugnable por sí; la resolución determinativa es el acto definitivo, recurrible, que cierra el procedimiento", "Ambas son actos definitivos y recurribles"], "a": 2, "j": "Los actos preparatorios (informes, dictámenes, proyectos) no producen efecto jurídico inmediato y no se impugnan. La liquidación del inspector es preparatoria; la vista y la resolución del juez administrativo son los actos que sí afectan derechos. La falta de impugnación en tiempo de la resolución habilita certificar la deuda y ejecutar.", "id": 127}, {"t": "pf", "q": "Un inspector de ARCA se presenta con una notificación de verificación y el contador del contribuyente pide presenciar la inspección. El inspector la rechaza diciendo que 'la ley los declara jueces administrativos'. ¿Qué corresponde sostener?", "o": ["Solo importa que sea un acto escrito", "El inspector tiene razón: puede ingresar y revisar sin restricciones", "Los inspectores no son jueces administrativos; el contribuyente tiene derecho al debido proceso y, para ingresar al domicilio sin consentimiento, se requiere orden judicial/de intervención", "El contribuyente puede impedir toda inspección"], "a": 2, "j": "El juez administrativo es un funcionario específico de la determinación de oficio, no el inspector. Las facultades de verificación existen, pero están limitadas por garantías constitucionales (inviolabilidad del domicilio y de los papeles privados, debido proceso). Además el 'informalismo' beneficia al administrado, no a la Administración.", "id": 128}, {"t": "pf", "q": "El inspector labra un acta de constatación y el contribuyente considera que es falsa. ¿Qué valor tiene el acta y cómo se ataca?", "o": ["Solo se puede atacar con querella por falsedad contra el inspector", "Es instrumento público con presunción de veracidad (no de certeza); la vía correcta es el art. 296 inc. b CCyC (falsedad de hechos), no acusar de falsedad ideológica al inspector", "Es prueba plena e irrefutable", "No tiene ningún valor probatorio"], "a": 1, "j": "Las actas gozan de legitimidad pero su eficacia probatoria admite impugnación. El 296 inc. a (falsedad de lo que el oficial público dice haber hecho/oído) implica atacar la honestidad del inspector y suele ser contraproducente; el inc. b alude a la falsedad de los hechos que el funcionario relata pero fueron declarados por terceros.", "id": 129}, {"t": "pf", "q": "En el fallo 'Havanna SA' (CFSS, sala II, 2020) se resolvió que, ante hechos y pruebas contradictorias,", "o": ["El Fisco no puede limitarse a lo que dice el acta: por oficialidad y verdad material debe investigar y ordenar las diligencias necesarias", "El acta prevalece siempre", "El contribuyente debe probar todo en 24 horas", "La carga de la prueba es exclusivamente del contribuyente"], "a": 0, "j": "Los dichos vertidos en la inspección son un punto de partida de una investigación mayor, no una presunción cierta (también 'Petito', 'Piedras Argentinas', 'Mercopallet'). El procedimiento administrativo es inquisitivo: el Fisco debe buscar la verdad real.", "id": 130}, {"t": "pf", "q": "Las actas de ARCA según su finalidad se clasifican en notificación, comprobación, inspección y constatación. ¿Cuál se vincula con los hechos u omisiones que dan origen a la clausura?", "o": ["Acta de comprobación de tareas", "Acta de inspección de libros (art. 35 c)", "Acta de notificación", "Acta de constatación (art. 41)"], "a": 3, "j": "La de constatación deja constancia de hechos u omisiones que pueden originar una sanción directa; por eso es la más 'grave'. La de inspección (art. 35 c) individualiza elementos inspeccionados; la de notificación pone en conocimiento un acto (art. 100).", "id": 131}, {"t": "pf", "q": "Una DDJJ se define (decreto 1759/72, art. 109) como:", "o": ["Un informe del contador sin responsabilidad del contribuyente", "Documento suscripto por el interesado que manifiesta bajo su responsabilidad que cumple los requisitos normativos y que se compromete a mantener ese cumplimiento", "Un formulario optativo para determinar el impuesto", "Una declaración de ARCA sobre lo que debe el contribuyente"], "a": 1, "j": "El art. 110 agrega que la inexactitud, falsedad u omisión esencial puede generar sanción y responsabilidad penal, civil o administrativa. La DDJJ sirve para que el contribuyente liquide y para que ARCA controle.", "id": 132}, {"t": "pf", "q": "Una DDJJ 'informativa' (ej.: F.931 sin saldo, participaciones societarias) que no se presenta genera:", "o": ["Omisión del art. 45 por el monto del impuesto", "Ninguna consecuencia", "Multa formal del art. 38, pero no omisión de impuesto, porque no determina un tributo a ingresar", "Defraudación del art. 46"], "a": 2, "j": "Informativa: informa datos para control sin determinar impuesto. Determinativa (IVA, Ganancias, Bienes Personales): fija base y monto; si no se presenta y hay impuesto omitido, además de la multa formal puede corresponder la del art. 45.", "id": 133}, {"t": "pf", "q": "La multa automática del art. 38 por no presentar la DDJJ se reduce a la mitad y no genera antecedente cuando:", "o": ["Se apela ante el Tribunal Fiscal", "Se paga antes del vencimiento de la DDJJ", "Dentro de los 15 días de notificada se paga voluntariamente y se presenta la DDJJ omitida", "Se presenta la DDJJ al año siguiente"], "a": 2, "j": "Es un beneficio para infracciones formales: cumplir lo omitido y pagar dentro de los 15 días reduce la multa a la mitad y no cuenta como antecedente (no es reincidencia). Los montos: en el apunte viejo $200 (persona humana) / $400 (jurídica); en la clase más reciente $220.000 / $440.000. Estudiá el monto que dio tu profesor.", "id": 134}, {"t": "pf", "q": "¿Quién puede ser notificado válidamente de una vista de DO mediante acta en la sede de ARCA?", "o": ["Cualquier empleado que esté en el lugar", "Nadie: solo vale la carta documento", "Solo el contribuyente personalmente", "El contribuyente o su apoderado con poder (por ej. general, F.3283), firmando el acta del art. 100 inc. b"], "a": 3, "j": "Caso 'Va Todo Bien SRL': la notificación personal por acta a quien tiene poder es válida. El art. 100 admite carta certificada, notificación personal con acta, nota o esquela, tarjeta, cédula, telegrama colacionado, edictos (5 días en el B.O.) y domicilio fiscal electrónico; si cae en día inhábil, se tiene por hecha el siguiente hábil.", "id": 135}, {"t": "pf", "q": "El secreto fiscal (art. 101) implica que:", "o": ["Los inspectores pueden declarar como testigos libremente", "ARCA puede publicar el patrimonio de los morosos", "Las informaciones declaradas ante ARCA no se admiten como prueba en causas judiciales (los jueces las rechazan de oficio), salvo en cuestiones de familia, procesos criminales o a pedido del interesado", "Solo protege a las personas jurídicas"], "a": 2, "j": "Protege la intimidad (art. 19 CN) y alcanza a magistrados, funcionarios, empleados judiciales y dependientes de ARCA. El caso típico de excepción que usa tu apunte es el juicio de alimentos. Sin el secreto, el contribuyente declararía con temor.", "id": 136}, {"t": "pf", "q": "Para responsabilizar solidariamente con sus bienes personales a un administrador por deudas de la sociedad (art. 8 inc. f), ARCA debe hacerlo:", "o": ["Con una resolución del Ministerio de Economía", "En una determinación de oficio bien hecha (con vista al responsable), no en la mera verificación y fiscalización", "Con una simple intimación a la sociedad", "No puede hacerlo nunca"], "a": 1, "j": "La DO es el procedimiento que garantiza la defensa del tercero al que se le quiere atribuir deuda ajena. Por eso aparece como una de las 'causas' de procedencia de la DO (junto a falta de DDJJ, DDJJ impugnada, cesión indebida de créditos y disconformidad conceptual).", "id": 137}, {"t": "pf", "q": "Cuando el pago de un impuesto se hace con crédito fiscal que fue cedido indebidamente (art. 29), el procedimiento correcto para responsabilizar solidariamente a los cedentes es:", "o": ["La ejecución fiscal directa", "El sumario del art. 70", "La repetición", "La determinación de oficio"], "a": 3, "j": "Es la tercera causa de procedencia de la DO: determinar la responsabilidad personal y solidaria de los cedentes cuando el crédito está mal cedido, mal calculado o no existe.", "id": 138}, {"t": "pf", "q": "El concepto 'acción de repetición' y el de 'compensación' (art. 28) son excluyentes: no se puede compensar un saldo a favor con deudas de otro impuesto mientras no se pida la repetición.", "o": ["Verdadero", "Falso"], "a": 1, "j": "Falso. La compensación (art. 28) permite aplicar saldos a favor a deudas de impuestos que administre ARCA, sin necesidad de repetir primero. La repetición es la acción para recuperar lo pagado indebidamente o en exceso (art. 81).", "vf": true, "id": 139}, {"t": "detof", "q": "¿En cuáles supuestos procede la determinació
